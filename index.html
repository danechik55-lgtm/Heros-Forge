<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚡ Hero's Forge — прокачка тела и ума</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: #0b0d0e;
      color: #e8edf0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== ПЕРЕЛИВАЮЩИЙСЯ ОРАНЖЕВЫЙ ФОН ===== */
    .bg-animated {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: #0d0805;
      overflow: hidden;
      pointer-events: none;
      transition: background 0.6s ease;
    }

    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.95;
      will-change: transform, opacity;
      transition: opacity 0.4s ease, filter 0.4s ease;
    }
    .bg-blob-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #ff6b1a 0%, #ff8c42 35%, #ff5a00 60%, transparent 75%);
      top: -15%; left: -15%;
      animation: blobFloat1 14s ease-in-out infinite;
    }
    .bg-blob-2 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, #ff9d3a 0%, #ff7a1a 35%, #ffaa44 60%, transparent 75%);
      bottom: -20%; right: -15%;
      animation: blobFloat2 17s ease-in-out infinite;
    }
    .bg-blob-3 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #ff5a00 0%, #ffaa44 40%, #ff6b1a 65%, transparent 80%);
      top: 35%; left: 20%;
      animation: blobFloat3 20s ease-in-out infinite;
      opacity: 0.85;
    }
    .bg-blob-4 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, #ffb866 0%, #ff6b1a 40%, #ff9d3a 65%, transparent 80%);
      top: 15%; right: 5%;
      animation: blobFloat4 16s ease-in-out infinite;
      opacity: 0.8;
    }
    .bg-blob-5 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #ff8c42 0%, #ff5a00 40%, transparent 75%);
      top: 40%; left: 50%;
      transform: translateX(-50%);
      animation: blobFloat5 22s ease-in-out infinite;
      opacity: 0.6;
    }

    .bg-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        135deg,
        rgba(255, 107, 26, 0.35) 0%,
        rgba(255, 140, 66, 0.2) 25%,
        rgba(255, 90, 0, 0.4) 50%,
        rgba(255, 157, 58, 0.25) 75%,
        rgba(255, 107, 26, 0.35) 100%
      );
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      mix-blend-mode: screen;
      transition: opacity 0.4s ease;
    }

    .bg-particles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: #ffaa55;
      border-radius: 50%;
      box-shadow: 0 0 10px 3px rgba(255, 140, 66, 0.9);
      animation: particleFloat linear infinite;
      opacity: 0;
      transition: box-shadow 0.4s ease;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) translateX(50px) scale(1.3); opacity: 0; }
    }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(
        ellipse at center,
        rgba(11, 13, 14, 0.05) 0%,
        rgba(11, 13, 14, 0.35) 100%
      );
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* ===== ВСПЫШКА ПРИ ВЫПОЛНЕНИИ КВЕСТА ===== */
    .fire-flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        circle at 50% 60%,
        rgba(255, 140, 40, 0.85) 0%,
        rgba(255, 100, 20, 0.5) 25%,
        rgba(255, 60, 0, 0.2) 50%,
        transparent 75%
      );
      mix-blend-mode: screen;
    }
    .fire-flash.burst {
      animation: fireBurst 1.8s cubic-bezier(0.25, 0.8, 0.4, 1) forwards;
    }
    @keyframes fireBurst {
      0% { opacity: 0; transform: scale(0.4); }
      15% { opacity: 1; transform: scale(1.1); }
      35% { opacity: 0.85; transform: scale(1); }
      70% { opacity: 0.4; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    /* Дополнительная вспышка ярких искр */
    .spark-flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      background: 
        radial-gradient(circle at 30% 40%, rgba(255, 200, 100, 0.7), transparent 40%),
        radial-gradient(circle at 70% 50%, rgba(255, 160, 60, 0.6), transparent 45%),
        radial-gradient(circle at 50% 70%, rgba(255, 120, 30, 0.5), transparent 40%);
      mix-blend-mode: screen;
      filter: blur(20px);
    }
    .spark-flash.burst {
      animation: sparkBurst 1.6s ease-out forwards;
    }
    @keyframes sparkBurst {
      0% { opacity: 0; }
      20% { opacity: 0.9; }
      60% { opacity: 0.5; }
      100% { opacity: 0; }
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    .app {
      max-width: 500px;
      width: 100%;
      background: rgba(15, 18, 20, 0.78);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      border-radius: 32px;
      padding: 20px 16px;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.85),
        0 0 0 1px rgba(255, 140, 66, 0.25),
        0 0 40px rgba(255, 107, 26, 0.35),
        0 0 80px rgba(255, 107, 26, 0.15),
        inset 0 1px 0 rgba(255, 180, 100, 0.15);
      border: 1px solid rgba(255, 140, 66, 0.3);
      margin: 0 auto;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.5s ease;
    }
    /* При вспышке карточка тоже светится ярче */
    .app.fire-burst {
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.85),
        0 0 0 2px rgba(255, 160, 80, 0.7),
        0 0 60px rgba(255, 130, 40, 0.75),
        0 0 120px rgba(255, 100, 20, 0.4),
        inset 0 1px 0 rgba(255, 200, 120, 0.4);
    }

    .app::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 34px;
      background: linear-gradient(
        135deg,
        rgba(255, 107, 26, 0.4),
        rgba(255, 157, 58, 0.2),
        rgba(255, 90, 0, 0.4),
        rgba(255, 140, 66, 0.2),
        rgba(255, 107, 26, 0.4)
      );
      background-size: 400% 400%;
      animation: borderGlow 8s ease infinite;
      z-index: -1;
      filter: blur(8px);
      opacity: 0.7;
      transition: opacity 0.5s ease, filter 0.5s ease;
    }
    .app.fire-burst::before {
      opacity: 1;
      filter: blur(14px);
    }
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
      text-shadow: 0 0 20px rgba(255, 140, 66, 0.3);
    }
    h1 .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #2a3135;
      padding: 2px 12px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 400;
      color: #b0c4d0;
    }
    .header-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .btn-header {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
      padding: 6px 10px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .btn-header:active { transform: scale(0.95); }
    .btn-header:hover {
      background: #2a3f48;
      border-color: #5a8596;
      color: #e0f4ff;
    }
    .btn-header.shop-btn {
      background: #2a3a2a;
      border-color: #5a8a5a;
      color: #b0e0b0;
    }
    .btn-header.shop-btn:hover {
      background: #3a5a3a;
      border-color: #7aba7a;
      color: #d0f4d0;
    }
    .btn-header.battle-btn {
      background: #3a1f1f;
      border-color: #b03030;
      color: #f0a0a0;
    }
    .btn-header.battle-btn:hover {
      background: #5a2a2a;
      border-color: #d04040;
      color: #ffc0c0;
    }

    .wallet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid #3a5a6a;
      margin: 14px 0 0;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 0 20px rgba(90, 138, 192, 0.15);
    }
    .wallet-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .soap-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)) drop-shadow(0 0 8px rgba(255, 140, 66, 0.3));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .wallet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .wallet-label {
      font-size: 11px;
      color: #8aacbc;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .wallet-value {
      font-size: 24px;
      font-weight: 700;
      color: #e0f4ff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .wallet-value small {
      font-size: 13px;
      font-weight: 400;
      color: #7a9aac;
      margin-left: 4px;
    }
    .wallet-hint {
      font-size: 11px;
      color: #6a8a9a;
      text-align: right;
      line-height: 1.3;
    }

    .active-relic-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2a2a1a, #3a3a2a);
      border: 1px solid #6a6a3a;
      padding: 10px 16px;
      border-radius: 20px;
      margin-top: 10px;
      box-shadow: 0 0 20px rgba(255, 215, 128, 0.15);
    }
    .relic-icon-big { font-size: 24px; line-height: 1; }
    .relic-active-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .relic-active-name { font-size: 13px; font-weight: 600; color: #ffd780; }
    .relic-active-desc { font-size: 11px; color: #b0a880; }

    .mode-switcher {
      display: flex;
      gap: 6px;
      background: #1e2529;
      padding: 5px;
      border-radius: 60px;
      border: 1px solid #2f383d;
      margin: 14px 0 8px;
      position: relative;
    }
    .mode-switcher.locked::after {
      content: '🔒';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #8a9ba5;
      padding: 8px 6px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      white-space: nowrap;
    }
    .mode-btn:active:not(:disabled) { transform: scale(0.96); }
    .mode-btn.active {
      background: #2a3b44;
      color: #e0f0fa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .mode-btn.active[data-mode="mind"] {
      background: #2a3a44;
      color: #b0d8ff;
    }
    .mode-btn.active[data-mode="body"] {
      background: #3a2f24;
      color: #ffb088;
    }
    .mode-btn.active[data-mode="balance"] {
      background: #2a3b35;
      color: #b0e0c8;
    }
    .mode-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .mode-hint {
      text-align: center;
      font-size: 11px;
      color: #6a8a96;
      margin-bottom: 12px;
      min-height: 16px;
      letter-spacing: 0.2px;
    }
    .mode-hint.locked-hint { color: #e0a080; }
    .stats-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 16px;
      background: #1e2529;
      padding: 12px 14px;
      border-radius: 28px;
      border: 1px solid #2f383d;
    }
    .stat-item {
      flex: 1 1 auto;
      min-width: 70px;
      background: #0b0d0e;
      padding: 4px 14px 4px 12px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2f383d;
      font-size: 13px;
    }
    .stat-item .label { font-size: 11px; color: #8a9ba5; white-space: nowrap; }
    .stat-item .value {
      font-weight: 600;
      font-size: 16px;
      color: #e0f0fa;
      white-space: nowrap;
    }
    .stat-item .value small {
      font-weight: 400;
      font-size: 11px;
      color: #7a8b96;
      margin-left: 2px;
    }
    .quest-section {
      background: #101618;
      border-radius: 28px;
      padding: 16px 14px;
      margin: 16px 0 20px;
      border: 1px solid #263034;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quest-header h2 {
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.2px;
      color: #d0dfe8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quest-header .date {
      background: #1e292f;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #a0b8c4;
      white-space: nowrap;
    }
    .level-icon {
      font-size: 12px;
      color: #ffd700;
      margin-left: 2px;
    }
    .quest-item {
      background: #1b2429;
      padding: 12px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border-left: 4px solid #4f7a8c;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quest-item:last-child { margin-bottom: 0; }
    .quest-item.mind-quest { border-left-color: #5a8ac0; }
    .quest-item.body-quest { border-left-color: #c08a5a; }
    /* Анимация при завершении квеста */
    .quest-item.completing {
      animation: questComplete 0.9s ease-out;
    }
    @keyframes questComplete {
      0% { 
        transform: scale(1); 
        box-shadow: 0 0 0 rgba(255, 140, 66, 0);
        background: #1b2429;
      }
      20% { 
        transform: scale(1.03); 
        box-shadow: 0 0 30px rgba(255, 140, 66, 0.8), 0 0 60px rgba(255, 107, 26, 0.4);
        background: #2a3a3a;
      }
      50% {
        transform: scale(1.01);
        box-shadow: 0 0 20px rgba(255, 160, 80, 0.6), 0 0 40px rgba(255, 107, 26, 0.3);
      }
      100% { 
        transform: scale(1); 
        box-shadow: 0 0 0 rgba(255, 140, 66, 0);
        background: #1f3a35;
      }
    }
    .quest-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 120px;
    }
    .quest-item .title {
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .quest-item .desc { font-size: 12px; color: #a6bbc8; line-height: 1.3; }
    .quest-item .badge {
      background: #2a3b44;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #c8dde8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .quest-item .badge .xp { color: #b8d9b0; font-weight: 500; }
    .quest-item .badge .xp-boosted { color: #ffd780; font-weight: 700; }
    .quest-item .badge .soap-reward { color: #a0d8ff; font-weight: 500; }
    .quest-item .badge .soap-reward-big { color: #ffd780; font-weight: 700; }
    .quest-item.hard-quest {
      border-left-color: #ff6b35;
      background: #1f2a2e;
    }
    .quest-item.hard-quest .title { color: #ff8a5c; }
    .quest-item.hard-quest .badge {
      background: #2f3f3a;
      border: 1px solid #ff6b35;
    }
    .quest-item.hard-quest .badge .xp { color: #ffb088; }
    .quest-item.hard-quest .badge .xp-boosted { color: #ffd780; font-weight: 700; }
    .quest-item.hard-quest .badge .soap-reward-big { color: #ffd780; }
    .quest-item.hard-quest .btn-done {
      background: #3f2f28;
      border-color: #ff6b35;
      color: #ffb088;
    }
    .hard-icon {
      background: #ff6b35;
      color: #0b0d0e;
      padding: 1px 8px;
      border-radius: 16px;
      font-size: 9px;
      font-weight: 700;
      display: inline-block;
    }
    .boost-indicator {
      color: #ffd780;
      font-size: 10px;
      font-weight: 700;
      margin-left: 4px;
    }
    .btn-done {
      background: #2b3f3a;
      border: none;
      color: #c0dfd0;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #3d5a55;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .btn-done:active { transform: scale(0.94); }
    .btn-done.completed {
      background: #1f3a35;
      color: #7aa89b;
      border-color: #3b6a60;
      opacity: 0.7;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .action-row .left-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .btn-refresh, .btn-hard {
      padding: 8px 14px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      flex: 1 1 auto;
      justify-content: center;
      min-width: 100px;
    }
    .btn-refresh {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
    }
    .btn-refresh:active:not(:disabled) { transform: scale(0.95); }
    .btn-refresh:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-hard {
      background: #2f241e;
      border: 1px solid #ff6b35;
      color: #ffb088;
    }
    .btn-hard:active:not(:disabled) { transform: scale(0.95); }
    .btn-hard:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .badge-count {
      background: #3a4f58;
      color: #b8d4e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-hard .badge-count {
      background: #ff6b35;
      color: #0b0d0e;
    }
    .reset-area {
      display: flex;

<script>
  (function(){
    "use strict";

    // ===== ЧАСТИЦЫ =====
    function generateParticles() {
      const container = document.getElementById('bgParticles');
      if (!container) return;
      const count = 30;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (10 + Math.random() * 15) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        const size = 2 + Math.random() * 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        container.appendChild(p);
      }
    }
    generateParticles();

    // ===== ЭФФЕКТ ВСПЫШКИ ОГНЯ ПРИ ВЫПОЛНЕНИИ КВЕСТА =====
    let fireBurstTimeout = null;
    function triggerFireBurst() {
      const bgAnimated = document.getElementById('bgAnimated');
      const bgGradient = document.getElementById('bgGradient');
      const bgOverlay = document.getElementById('bgOverlay');
      const app = document.getElementById('app');
      const fireFlash = document.getElementById('fireFlash');
      const sparkFlash = document.getElementById('sparkFlash');
      const blobs = [
        document.getElementById('blob1'),
        document.getElementById('blob2'),
        document.getElementById('blob3'),
        document.getElementById('blob4'),
        document.getElementById('blob5'),
      ];
      const particles = document.querySelectorAll('.particle');

      // 1) Вспышка
      fireFlash.classList.remove('burst');
      sparkFlash.classList.remove('burst');
      app.classList.remove('fire-burst');
      // Форсируем reflow чтобы анимации перезапустились
      void fireFlash.offsetWidth;
      void sparkFlash.offsetWidth;
      void app.offsetWidth;

      fireFlash.classList.add('burst');
      sparkFlash.classList.add('burst');
      app.classList.add('fire-burst');

      // 2) Фон стал ярче
      bgAnimated.style.background = '#1a0c05';
      bgGradient.style.opacity = '1.6';
      bgGradient.style.filter = 'brightness(1.6) saturate(1.3)';
      bgOverlay.style.opacity = '0.15';

      // 3) Пятна стали ярче и больше размытие
      blobs.forEach((blob, i) => {
        if (!blob) return;
        blob.style.opacity = '1';
        blob.style.filter = 'blur(90px) brightness(1.5) saturate(1.3)';
        blob.style.transition = 'opacity 0.3s ease, filter 0.3s ease';
      });

      // 4) Частицы ярче
      particles.forEach(p => {
        p.style.boxShadow = '0 0 20px 6px rgba(255, 180, 80, 1)';
        p.style.background = '#ffcc66';
      });

      // Сбрасываем через 1.8 секунды
      clearTimeout(fireBurstTimeout);
      fireBurstTimeout = setTimeout(() => {
        // Восстанавливаем фон
        bgAnimated.style.background = '#0d0805';
        bgGradient.style.opacity = '';
        bgGradient.style.filter = '';
        bgOverlay.style.opacity = '';

        blobs.forEach(blob => {
          if (!blob) return;
          blob.style.opacity = '';
          blob.style.filter = '';
        });

        particles.forEach(p => {
          p.style.boxShadow = '';
          p.style.background = '';
        });

        app.classList.remove('fire-burst');
      }, 1800);
    }

    const XP_TO_SOAP_RATE = 500;
    const SOAP_REWARD = 20;
    const HARD_QUEST_SOAP = 5;
    const NORMAL_QUEST_SOAP = 1;
    const BATTLE_CODE_PREFIX = 'HF1-';

    const SHOP_ITEMS = {
      relics: [
        { id: 'demeter', name: 'Реликвия Деметры', icon: '🌾', price: 25, boost: 0.15, type: 'all',
          desc: 'Древняя реликвия плодородия. Даёт стабильный буст ко всему опыту.' },
        { id: 'dionysus', name: 'Реликвия Диониса', icon: '🍇', price: 35, boost: 0.20, type: 'all',
          desc: 'Реликвия веселья и вдохновения. Усиливает весь получаемый опыт.' },
        { id: 'hermes', name: 'Реликвия Гермеса', icon: '🪽', price: 50, boost: 0.40, type: 'all',
          desc: 'Реликвия скорости и ловкости. Значительно ускоряет рост.' },
        { id: 'poseidon', name: 'Реликвия Посейдона', icon: '🔱', price: 60, boost: 0.50, type: 'all',
          desc: 'Реликвия мощи океана. Мощный буст ко всему опыту.' },
        { id: 'hera', name: 'Реликвия Геры', icon: '👑', price: 70, boost: 0.65, type: 'all',
          desc: 'Реликвия царственности. Один из лучших универсальных бустов.' },
        { id: 'athena', name: 'Реликвия Афины', icon: '🦉', price: 150, boost: 0.75, type: 'mind',
          desc: 'Реликвия мудрости. Даёт +75% XP ТОЛЬКО за когнитивные квесты.' },
        { id: 'hephaestus', name: 'Реликвия Гефеста', icon: '⚒️', price: 150, boost: 0.75, type: 'body',
          desc: 'Реликвия кузнеца. Даёт +75% XP ТОЛЬКО за физические квесты.' },
      ],

      const newD = new Date(newDate + 'T00:00:00');
      const diffDays = Math.round((newD - oldD) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) { state.stats.streak = (state.stats.streak || 0) + 1; }
      else if (diffDays > 1) {

          state.streakShield -= 1;

      const filtered = QUEST_TEMPLATES.filter(t => allowedTypes.includes(t.type));
      const shuffled = [...filtered].sort(() => Math.random() - 0.5);
      const count = Math.random() < 0.5 ? 4 : 5;
      const selected = shuffled.slice(0, Math.min(count, shuffled.length));
      return selected.map(template => {
        const xpMultiplier = 1 + (level - 1) * 0.15;
        const baseXp = template.baseXp || 20;
        const scaledXp = Math.round(baseXp * xpMultiplier);
        return { type: template.type, title: template.baseTitle, desc: template.baseDesc(level), xp: scaledXp };
      });
    }

      const filtered = HARD_QUEST_POOL.filter(q => allowedTypes.includes(q.type));
      if (filtered.length === 0) return null;
      const shuffled = [...filtered].sort(() => Math.random() - 0.5);
      const baseQuest = shuffled[0];
      const xpMultiplier = 1 + (level - 1) * 0.1;
      const scaledXp = Math.round(baseQuest.xp * xpMultiplier);

      state.completedToday.forEach(index => {
        const q = state.currentQuests[index];
        if (q && !q.isHard) completedTitles.add(q.title);
      });
      const newCompleted = [];
      newQuests.forEach((q, idx) => {
        if (completedTitles.has(q.title)) newCompleted.push(idx);
      });
      let hasHard = false, hardData = null;
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const hq = state.currentQuests[state.hardQuestIndex];
        if (hq && hq.isHard) {
          if (!state.completedToday.includes(state.hardQuestIndex)) {
            hasHard = true; hardData = hq;
          } else {
            state.hardQuestCompleted = true;
            state.hardQuestUsed = true;
          }
        }
      }
      let final = [...newQuests], hIdx = -1;
      if (hasHard && hardData) { final.push(hardData); hIdx = final.length - 1; }
      state.currentQuests = final;
      state.completedToday = newCompleted;
      state.hardQuestIndex = hIdx;
      state.lastDate = today;
      state.refreshCount -= 1;
      if (state.hardQuestCompleted) state.hardQuestUsed = true;
      showToast(`🔄 Обновлено (осталось ${state.refreshCount}/2)`, 1800);
      recalcLevel(); saveState(); render();
    }
    function handleHardQuest() {
      if (isAllQuestsCompleted()) { showToast('✅ Все квесты выполнены!', 2500); return; }
      if (state.hardRefreshCount <= 0) { showToast('⚠️ Лимит сложных квестов', 2000); return; }
      if (state.hardQuestUsed && state.hardQuestCompleted) { showToast('⚠️ Сложный квест уже выполнен', 2000); return; }
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const existing = state.currentQuests[state.hardQuestIndex];
        if (existing && existing.isHard) {
          if (state.completedToday.includes(state.hardQuestIndex)) {
            showToast('⚠️ Сложный квест уже выполнен', 2000); return;
          }
          state.currentQuests.splice(state.hardQuestIndex, 1);
          state.hardQuestIndex = -1;
        }
      }
      const hardQuest = generateHardQuest(state.level, state.mode);
      if (!hardQuest) { showToast('⚠️ Нет сложных квестов', 1800); return; }
      const questWithMarker = { ...hardQuest, isHard: true };
      state.currentQuests.push(questWithMarker);
      state.hardQuestIndex = state.currentQuests.length - 1;
      state.hardQuestUsed = true;
      state.hardQuestCompleted = false;
      state.hardRefreshCount -= 1;
      showToast(`⭐ Сложный квест (осталось ${state.hardRefreshCount}/1)`, 2000);
      recalcLevel(); saveState(); render();
    }
    function completeQuest(index) {
      if (state.completedToday.includes(index)) return;
      const quest = state.currentQuests[index];
      if (!quest) return;

      // 🎬 ВСПЫШКА ОГНЯ!
      triggerFireBurst();

      // Анимация карточки квеста
      const questCard = document.querySelector(`.quest-item[data-index="${index}"]`);
      if (questCard) {
        questCard.classList.add('completing');
      }

      const boostedXp = getQuestXpWithBoost(quest);
      const boost = getBoostForQuest(quest);
      const soapReward = getQuestSoapReward(quest);
      state.xp += boostedXp;
      state.completedToday.push(index);
      if (!state.modeLocked) state.modeLocked = true;
      state.soap += soapReward;
      state.stats.totalSoapEarned += soapReward;
      state.stats.totalCompleted += 1;
      state.stats.totalXpEarned += boostedXp;
      if (quest.isHard) state.stats.hardCompleted += 1;
      else if (quest.type === 'mind') state.stats.mindCompleted += 1;
      else if (quest.type === 'body') state.stats.bodyCompleted += 1;
      addActiveDay(getTodayStr());
      const boostText = boost > 0 ? ` (🔥 +${Math.round(boost * 100)}%)` : '';
      const lockText = state.modeLocked ? ' • 🔒 Режим зафиксирован' : '';
      if (quest.isHard) {
        state.hardQuestCompleted = true;
        state.hardQuestUsed = true;
        showToast(`⭐ +${boostedXp} XP${boostText} • +${soapReward} 🧼`, 2200);
      } else {
        showToast(`✅ +${boostedXp} XP${boostText} • +${soapReward} 🧼${lockText}`, 2000);
      }
      recalcLevel(); saveState();

      // Небольшая задержка — даём анимации проиграться, потом ререндер
      setTimeout(() => { render(); }, 500);
    }

    function buyRelic(relicId) {
      const relic = SHOP_ITEMS.relics.find(r => r.id === relicId);
      if (!relic) return;

      if (!confirm(`Купить "${relic.name}" за ${relic.price} 🧼?`)) return;
      state.soap -= relic.price;

      saveState(); render(); renderShop();
    }
    function activateRelic(relicId) {
      if (!state.ownedRelics.includes(relicId)) return;
      const relic = SHOP_ITEMS.relics.find(r => r.id === relicId);
      if (!relic) return;
      state.activeRelic = relicId;
      saveState(); render(); renderShop();
      showToast(`${relic.icon} ${relic.name} активирована!`, 2000);

    function exchangeXpForSoap() {
      if (state.xp < XP_TO_SOAP_RATE) { showToast(`⚠️ Нужно ${XP_TO_SOAP_RATE} XP`, 2000); return; }
      const exchangesPossible = Math.floor(state.xp / XP_TO_SOAP_RATE);
      const totalXpToSpend = exchangesPossible * XP_TO_SOAP_RATE;
      const totalSoapToGet = exchangesPossible * SOAP_REWARD;
      if (!confirm(`Обменять ${totalXpToSpend} XP на ${totalSoapToGet} 🧼?\n\nУровень может понизиться!`)) return;
      state.xp -= totalXpToSpend;
      state.soap += totalSoapToGet;
      state.stats.totalXpExchanged += totalXpToSpend;
      state.stats.totalSoapEarned += totalSoapToGet;
      recalcLevelAfterExchange();
      saveState(); render(); renderShop();
      showToast(`💱 ${totalXpToSpend} XP → ${totalSoapToGet} 🧼`, 2500);
    }
    function recalcLevelAfterExchange() {
      const newLevel = Math.floor(state.xp / 100) + 1;
      if (newLevel !== state.level) {
        const oldLevel = state.level;
        state.level = Math.max(1, newLevel);
        if (state.level < oldLevel) showToast(`📉 Уровень понижен: ${oldLevel} → ${state.level}`, 2500);
        else if (state.level > oldLevel) {
          levelUpBadge.style.display = 'inline-block';
          showToast(`⬆ Уровень ${state.level}!`, 2500);
          setTimeout(() => { levelUpBadge.style.display = 'none'; }, 2800);
        }
      }

      if (!confirm(`Купить "${item.name}" за ${item.price} 🧼?`)) return;
      state.soap -= item.price;
      state.stats.totalSoapSpent += item.price;
      let effectMessage = '';
      switch(itemId) {
        case 'extra_refresh': state.refreshCount += 1; effectMessage = `+1 обновление (${state.refreshCount})`; break;

          state.xp += xpGain;
          state.stats.totalXpEarned += xpGain;
          recalcLevel();
          effectMessage = `+${xpGain} XP за ${item.price} 🧼`;

              <div class="ts-header">🧠 Ум</div>
              <div class="ts-count mind-color">${s.mindCompleted}</div>
              <div class="ts-bar"><div class="ts-bar-fill mind-fill" style="width: ${(s.mindCompleted / maxTypeCount) * 100}%;"></div></div>
              <div class="ts-pct">${mindPct}% от всех</div>
            </div>
            <div class="type-stat">
              <div class="ts-header">💪 Тело</div>
              <div class="ts-count body-color">${s.bodyCompleted}</div>
              <div class="ts-bar"><div class="ts-bar-fill body-fill" style="width: ${(s.bodyCompleted / maxTypeCount) * 100}%;"></div></div>
              <div class="ts-pct">${bodyPct}% от всех</div>
            </div>
          </div>
          <div class="progress-line" style="margin-top: 10px;">
            <div class="pl-top"><span class="pl-label">🔥 Сложных</span><span class="pl-value" style="color: #ffb088;">${s.hardCompleted}</span></div>
          </div>
        </div>
      `;
      html += `<div class="stat-block"><h3>📅 Активность (28 дней)</h3><div class="activity-grid">`;
      days.forEach(d => {
        const classes = ['activity-day'];
        if (d.isActive) classes.push('active');
        if (d.isToday) classes.push('today');
        html += `<div class="${classes.join(' ')}" title="${d.date}">${d.day}</div>`;
      });
      html += `</div><div class="activity-legend"><span>← 4 недели назад</span><span>Сегодня →</span></div></div>`;
      if (total === 0) {
        html += `<div class="empty-stats"><span class="emoji">🌱</span>Начните выполнять квесты!</div>`;
      } else {
        html += `
          <div class="stat-block" style="margin-bottom: 0;">
            <h3>💡 Итог</h3>
            <div style="font-size: 13px; color: #a6bbc8; line-height: 1.6;">
              Выполнено <b style="color:#e0f0fa;">${total}</b> квестов, заработано 
              <b style="color:#b8e0a0;">${s.totalXpEarned} XP</b> и 
              <b style="color:#a0d8ff;">${s.totalSoapEarned} 🧼</b>. 
              ${s.streak > 1 ? `Серия — <b style="color:#ffd780;">${s.streak} дней!</b>` : 'Продолжайте!'}
            </div>
          </div>
        `;
      }
      statsContent.innerHTML = html;
    }
    function openStats() { renderStats(); statsModal.classList.add('open'); }
    function closeStats() { statsModal.classList.remove('open'); }

    function getBattleData() {
      return {
        v: 1, lvl: state.level, xp: state.xp, soap: state.soap,
        totalXp: state.stats.totalXpEarned, totalQ: state.stats.totalCompleted,
        mind: state.stats.mindCompleted, body: state.stats.bodyCompleted,
        hard: state.stats.hardCompleted, streak: state.stats.streak,
        best: state.stats.bestStreak, relics: state.ownedRelics.length,
        days: state.dayCounter, br: state.battleRecord.wins,
      };
    }
    function encodeBattleCode() {
      try {
        const data = getBattleData();
        const json = JSON.stringify(data);
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return BATTLE_CODE_PREFIX + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      } catch (e) { return null; }
    }
    function decodeBattleCode(code) {
      try {
        code = code.trim();
        if (!code.startsWith(BATTLE_CODE_PREFIX)) return null;
        let b64 = code.slice(BATTLE_CODE_PREFIX.length);
        b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        const data = JSON.parse(json);
        if (typeof data.lvl !== 'number' || typeof data.xp !== 'number') return null;
        return data;
      } catch (e) { return null; }
    }
    function compareBattles(me, enemy) {
      const categories = [
        { key: 'lvl', label: 'Уровень', icon: '🏋️', me: me.lvl, enemy: enemy.lvl },
        { key: 'totalXp', label: 'Всего XP', icon: '🧘', me: me.totalXp, enemy: enemy.totalXp },
        { key: 'totalQ', label: 'Квестов', icon: '📋', me: me.totalQ, enemy: enemy.totalQ },
        { key: 'mind', label: 'Ум', icon: '🧠', me: me.mind, enemy: enemy.mind },
        { key: 'body', label: 'Тело', icon: '💪', me: me.body, enemy: enemy.body },
        { key: 'hard', label: 'Сложных', icon: '⭐', me: me.hard, enemy: enemy.hard },
        { key: 'streak', label: 'Серия', icon: '🔥', me: me.streak, enemy: enemy.streak },
        { key: 'relics', label: 'Реликвий', icon: '🏛️', me: me.relics, enemy: enemy.relics },
        { key: 'soap', label: 'Мыло', icon: '🧼', me: me.soap, enemy: enemy.soap },
      ];
      let myWins = 0, enemyWins = 0, draws = 0;
      const results = categories.map(c => {
        let winner = 'draw';
        if (c.me > c.enemy) { winner = 'me'; myWins++; }
        else if (c.me < c.enemy) { winner = 'enemy'; enemyWins++; }
        else { draws++; }
        return { ...c, winner };
      });
      let overall = 'draw';
      if (myWins > enemyWins) overall = 'win';
      else if (myWins < enemyWins) overall = 'loss';
      return { results, myWins, enemyWins, draws, overall };
    }
    function saveBattleToHistory(enemyData, comparison) {
      const battle = {
        date: getTodayStr(),
        enemy: { lvl: enemyData.lvl, totalXp: enemyData.totalXp, totalQ: enemyData.totalQ },
        myWins: comparison.myWins, enemyWins: comparison.enemyWins, overall: comparison.overall,
      };
      state.battleHistory.unshift(battle);
      if (state.battleHistory.length > 20) state.battleHistory = state.battleHistory.slice(0, 20);
      if (comparison.overall === 'win') state.battleRecord.wins += 1;
      else if (comparison.overall === 'loss') state.battleRecord.losses += 1;
      else state.battleRecord.draws += 1;
      saveState();
    }
    function renderBattle() {
      let html = '';
      html += `
        <div class="battle-intro">
          <h3>⚔️ Арена поединков</h3>
          <p>Бросьте вызов другу! Поделитесь своим кодом,<br>или вставьте код соперника для сравнения статистик.</p>
          <div class="battle-actions">
            <button class="battle-action-btn share" id="shareCodeBtn">📤 Поделиться кодом</button>
            <button class="battle-action-btn fight" id="enterCodeBtn">⚔️ Ввести код соперника</button>
          </div>
          <div id="shareCodeArea"></div>
        </div>
      `;
      const my = getBattleData();
      html += `
        <div class="battle-player-card">
          <h4>🛡️ Ваш профиль</h4>
          <div class="battle-player-stats">
            <div class="battle-player-stat"><div class="bps-val">${my.lvl}</div><div class="bps-lbl">Уровень</div></div>
            <div class="battle-player-stat"><div class="bps-val">${my.totalXp}</div><div class="bps-lbl">Всего XP</div></div>
            <div class="battle-player-stat"><div class="bps-val">${my.totalQ}</div><div class="bps-lbl">Квестов</div></div>
            <div class="battle-player-stat"><div class="bps-val">${my.mind}</div><div class="bps-lbl">🧠 Ум</div></div>
            <div class="battle-player-stat"><div class="bps-val">${my.body}</div><div class="bps-lbl">💪 Тело</div></div>
            <div class="battle-player-stat"><div class="bps-val">${my.hard}</div><div class="bps-lbl">⭐ Сложных</div></div>
          </div>
        </div>
      `;
      const br = state.battleRecord;
      const totalBattles = br.wins + br.losses + br.draws;
      if (totalBattles > 0) {
        html += `
          <div class="battle-history">
            <h3>🏆 Ваша запись</h3>
            <div style="display: flex; gap: 12px; justify-content: space-around;">
              <div style="text-align: center;">
                <div style="font-size: 22px; font-weight: 700; color: #90e0a0;">${br.wins}</div>
                <div style="font-size: 11px; color: #7a8b96;">Победы</div>
              </div>
              <div style="text-align: center;">
                <div style="font-size: 22px; font-weight: 700; color: #e09090;">${br.losses}</div>
                <div style="font-size: 11px; color: #7a8b96;">Поражения</div>
              </div>
              <div style="text-align: center;">
                <div style="font-size: 22px; font-weight: 700; color: #e0d090;">${br.draws}</div>
                <div style="font-size: 11px; color: #7a8b96;">Ничьи</div>
              </div>
            </div>
          </div>
        `;
      }
      html += `<div class="battle-history"><h3>📜 История боёв</h3>`;
      if (state.battleHistory.length === 0) {
        html += `<div class="battle-empty-history"><span class="emoji">⚔️</span>Ещё не было поединков.<br>Бросьте вызов другу!</div>`;
      } else {
        state.battleHistory.slice(0, 5).forEach(b => {
          const icon = b.overall === 'win' ? '🏆' : b.overall === 'loss' ? '💀' : '🤝';
          const resultText = b.overall === 'win' ? 'Победа' : b.overall === 'loss' ? 'Поражение' : 'Ничья';
          html += `
            <div class="battle-history-item ${b.overall}">
              <div class="battle-history-left">
                <div class="battle-history-icon">${icon}</div>
                <div class="battle-history-info">
                  <div class="battle-history-name">${resultText} vs Lv.${b.enemy.lvl}</div>
                  <div class="battle-history-date">${formatDate(b.date)} • ${b.enemy.totalQ} квестов у врага</div>
                </div>
              </div>
              <div class="battle-history-score ${b.overall}">${b.myWins}:${b.enemyWins}</div>
            </div>
          `;
        });
      }
      html += `</div>`;
      battleContent.innerHTML = html;
      document.getElementById('shareCodeBtn').addEventListener('click', showShareCode);
      document.getElementById('enterCodeBtn').addEventListener('click', showEnterCode);
    }
    function showShareCode() {
      const code = encodeBattleCode();
      const area = document.getElementById('shareCodeArea');
      if (!code) { area.innerHTML = `<div class="battle-input-error show">Ошибка генерации кода</div>`; return; }
      area.innerHTML = `
        <div class="battle-code" id="myBattleCode">${code}</div>
        <div class="battle-code-hint">👆 Нажмите на код, чтобы скопировать</div>
      `;
      const codeEl = document.getElementById('myBattleCode');
      codeEl.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          showToast('📋 Код скопирован!', 1800);
        } catch (e) {
          const range = document.createRange();
          range.selectNode(codeEl);
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
          try { document.execCommand('copy'); showToast('📋 Код скопирован!', 1800); }
          catch (err) { showToast('⚠️ Скопируйте вручную', 2000); }
        }
      });
    }
    function showEnterCode() {
      const area = document.getElementById('shareCodeArea');
      area.innerHTML = `
        <div class="battle-input-container">
          <label class="battle-input-label">📥 Вставьте код соперника (HF1-...):</label>
          <textarea class="battle-input" id="battleCodeInput" placeholder="HF1-..."></textarea>
          <div class="battle-input-error" id="battleInputError"></div>
          <button class="battle-submit-btn" id="battleFightBtn">⚔️ Начать поединок</button>
        </div>
      `;
      document.getElementById('battleFightBtn').addEventListener('click', () => {
        const input = document.getElementById('battleCodeInput').value.trim();
        const errEl = document.getElementById('battleInputError');
        if (!input) { errEl.textContent = 'Введите код'; errEl.classList.add('show'); return; }
        const enemyData = decodeBattleCode(input);
        if (!enemyData) {
          errEl.textContent = '❌ Неверный код. Проверьте и попробуйте снова.';
          errEl.classList.add('show'); return;
        }
        errEl.classList.remove('show');
        startBattle(enemyData);
      });
    }
    function startBattle(enemyData) {
      const my = getBattleData();
      const comparison = compareBattles(my, enemyData);
      saveBattleToHistory(enemyData, comparison);
      renderBattleResult(enemyData, comparison);
    }
    function renderBattleResult(enemyData, comparison) {
      const overall = comparison.overall;
      let headerClass, emoji, title;
      if (overall === 'win') { headerClass = 'win'; emoji = '🏆'; title = 'ПОБЕДА!'; }
      else if (overall === 'loss') { headerClass = 'loss'; emoji = '💀'; title = 'ПОРАЖЕНИЕ'; }
      else { headerClass = 'draw'; emoji = '🤝'; title = 'НИЧЬЯ'; }
      let html = `
        <div class="battle-result-header ${headerClass}">
          <div class="battle-result-emoji">${emoji}</div>
          <div class="battle-result-title">${title}</div>
          <div class="battle-result-score">Счёт: ${comparison.myWins} : ${comparison.enemyWins}${comparison.draws > 0 ? ` (${comparison.draws} ничьих)` : ''}</div>
        </div>
      `;
      html += `
        <div class="battle-player-card enemy">
          <h4>⚔️ Соперник</h4>
          <div class="battle-player-stats">
            <div class="battle-player-stat"><div class="bps-val">${enemyData.lvl}</div><div class="bps-lbl">Уровень</div></div>
            <div class="battle-player-stat"><div class="bps-val">${enemyData.totalXp}</div><div class="bps-lbl">Всего XP</div></div>
            <div class="battle-player-stat"><div class="bps-val">${enemyData.totalQ}</div><div class="bps-lbl">Квестов</div></div>
            <div class="battle-player-stat"><div class="bps-val">${enemyData.mind}</div><div class="bps-lbl">🧠 Ум</div></div>
            <div class="battle-player-stat"><div class="bps-val">${enemyData.body}</div><div class="bps-lbl">💪 Тело</div></div>
            <div class="battle-player-stat"><div class="bps-val">${enemyData.hard}</div><div class="bps-lbl">⭐ Сложных</div></div>
          </div>
        </div>
      `;
      html += `<div class="battle-stats-list">`;
      comparison.results.forEach(r => {
        const meVal = r.me;
        const enemyVal = r.enemy;
        const meWin = r.winner === 'me';
        const enemyWin = r.winner === 'enemy';
        html += `
          <div class="battle-stat-row ${meWin ? 'win-me' : ''} ${enemyWin ? 'win-enemy' : ''}">
            <div class="battle-stat-side left">
              <div class="battle-stat-value ${meWin ? 'win' : 'lose'}">${meVal}</div>
              <div class="battle-stat-label">Вы</div>
            </div>
            <div class="battle-stat-middle">
              <div class="battle-stat-icon">${r.icon}</div>
              <div class="battle-stat-category">${r.label}</div>
            </div>
            <div class="battle-stat-side right">
              <div class="battle-stat-value ${enemyWin ? 'win' : 'lose'}">${enemyVal}</div>
              <div class="battle-stat-label">Соперник</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      html += `
        <button class="battle-submit-btn" id="battleAgainBtn" style="background: linear-gradient(135deg, #2a3a4a, #3a4a5a); border-color: #5a7a9a; color: #d0e8f8;">
          🔄 Новый поединок
        </button>
      `;
      battleContent.innerHTML = html;
      document.getElementById('battleAgainBtn').addEventListener('click', renderBattle);
      showToast(overall === 'win' ? '🏆 Победа! +1 в копилку' : overall === 'loss' ? '💀 Поражение' : '🤝 Ничья', 2500);
    }
    function openBattle() { renderBattle(); battleModal.classList.add('open'); }
    function closeBattle() { battleModal.classList.remove('open'); }

    function resetProgress() {
      if (confirm('Сбросить весь прогресс? (уровень, очки, квесты, мыло, реликвии, поединки)')) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          level: 1, xp: 0, dayCounter: 0, lastDate: null,
          completedToday: [], currentQuests: [],
          hardQuestUsed: false, hardQuestCompleted: false, hardQuestIndex: -1,
          refreshCount: 2, hardRefreshCount: 1, mode: 'balance',
          soap: 0, ownedRelics: [], activeRelic: null, streakShield: 0,
          modeLocked: false,
          battleHistory: [], battleRecord: { wins: 0, losses: 0, draws: 0 },
          stats: {
            totalCompleted: 0, mindCompleted: 0, bodyCompleted: 0,
            hardCompleted: 0, totalXpEarned: 0, streak: 0, bestStreak: 0,
            activeDays: [], totalSoapEarned: 0, totalSoapSpent: 0,
            totalXpExchanged: 0,
          },
        };
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === 'balance');
        });
        modeHint.textContent = MODES.balance.hint;
        modeHint.classList.remove('locked-hint');
        modeSwitcher.classList.remove('locked');
        initDay(); render();
        closeStats(); closeShop(); closeBattle();
        showToast('🔄 Прогресс сброшен', 1800);
      }
    }

    function init() {
      loadState();
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.mode);
      });
      modeHint.textContent = MODES[state.mode].hint;
      initDay(); recalcLevel(); render();
      modeSwitcher.addEventListener('click', function(e) {
        const btn = e.target.closest('.mode-btn');
        if (!btn || btn.disabled) return;
        switchMode(btn.dataset.mode);
      });
      refreshBtn.addEventListener('click', refreshQuests);
      hardQuestBtn.addEventListener('click', handleHardQuest);
      resetBtn.addEventListener('click', resetProgress);
      statsBtn.addEventListener('click', openStats);
      statsCloseBtn.addEventListener('click', closeStats);
      shopBtn.addEventListener('click', openShop);
      shopCloseBtn.addEventListener('click', closeShop);
      battleBtn.addEventListener('click', openBattle);
      battleCloseBtn.addEventListener('click', closeBattle);
      statsModal.addEventListener('click', function(e) { if (e.target === statsModal) closeStats(); });
      shopModal.addEventListener('click', function(e) { if (e.target === shopModal) closeShop(); });
      battleModal.addEventListener('click', function(e) { if (e.target === battleModal) closeBattle(); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeStats(); closeShop(); closeBattle(); }
      });
      setInterval(() => {
        const today = getTodayStr();
        if (state.lastDate !== today) {
          initDay(); recalcLevel(); render();
          showToast('🌅 Новый день! Режим разблокирован.', 2400);
        }
      }, 3600000);
    }
    init();
  })();
</script>
</body>
</html>
