<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚡ Hero's Forge — прокачка тела и ума</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: #0b0d0e;
      color: #e8edf0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }
    .app {
      max-width: 500px;
      width: 100%;
      background: #14181a;
      border-radius: 32px;
      padding: 20px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border: 1px solid #2a3135;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #2a3135;
      padding: 2px 12px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 400;
      color: #b0c4d0;
    }
    .stats-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 20px;
      background: #1e2529;
      padding: 12px 14px;
      border-radius: 28px;
      border: 1px solid #2f383d;
    }
    .stat-item {
      flex: 1 1 auto;
      min-width: 70px;
      background: #0b0d0e;
      padding: 4px 14px 4px 12px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2f383d;
      font-size: 13px;
    }
    .stat-item .label {
      font-size: 11px;
      color: #8a9ba5;
      white-space: nowrap;
    }
    .stat-item .value {
      font-weight: 600;
      font-size: 16px;
      color: #e0f0fa;
      white-space: nowrap;
    }
    .stat-item .value small {
      font-weight: 400;
      font-size: 11px;
      color: #7a8b96;
      margin-left: 2px;
    }
    .quest-section {
      background: #101618;
      border-radius: 28px;
      padding: 16px 14px;
      margin: 16px 0 20px;
      border: 1px solid #263034;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quest-header h2 {
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.2px;
      color: #d0dfe8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quest-header .date {
      background: #1e292f;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #a0b8c4;
      white-space: nowrap;
    }
    .level-icon {
      font-size: 12px;
      color: #ffd700;
      margin-left: 2px;
    }
    .quest-item {
      background: #1b2429;
      padding: 12px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border-left: 4px solid #4f7a8c;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quest-item:last-child {
      margin-bottom: 0;
    }
    .quest-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 120px;
    }
    .quest-item .title {
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .quest-item .desc {
      font-size: 12px;
      color: #a6bbc8;
      line-height: 1.3;
    }
    .quest-item .badge {
      background: #2a3b44;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #c8dde8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .quest-item .badge .xp {
      color: #b8d9b0;
      font-weight: 500;
    }
    .quest-item.hard-quest {
      border-left-color: #ff6b35;
      background: #1f2a2e;
    }
    .quest-item.hard-quest .title {
      color: #ff8a5c;
    }
    .quest-item.hard-quest .badge {
      background: #2f3f3a;
      border: 1px solid #ff6b35;
    }
    .quest-item.hard-quest .badge .xp {
      color: #ffb088;
    }
    .quest-item.hard-quest .btn-done {
      background: #3f2f28;
      border-color: #ff6b35;
      color: #ffb088;
    }
    .quest-item.hard-quest .btn-done:active {
      transform: scale(0.94);
    }
    .hard-icon {
      background: #ff6b35;
      color: #0b0d0e;
      padding: 1px 8px;
      border-radius: 16px;
      font-size: 9px;
      font-weight: 700;
      display: inline-block;
    }
    .btn-done {
      background: #2b3f3a;
      border: none;
      color: #c0dfd0;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #3d5a55;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .btn-done:active {
      transform: scale(0.94);
    }
    .btn-done.completed {
      background: #1f3a35;
      color: #7aa89b;
      border-color: #3b6a60;
      opacity: 0.7;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .action-row .left-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .btn-refresh, .btn-hard {
      padding: 8px 14px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      flex: 1 1 auto;
      justify-content: center;
      min-width: 100px;
    }
    .btn-refresh {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
    }
    .btn-refresh:active:not(:disabled) {
      transform: scale(0.95);
    }
    .btn-refresh:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-hard {
      background: #2f241e;
      border: 1px solid #ff6b35;
      color: #ffb088;
    }
    .btn-hard:active:not(:disabled) {
      transform: scale(0.95);
    }
    .btn-hard:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .badge-count {
      background: #3a4f58;
      color: #b8d4e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-hard .badge-count {
      background: #ff6b35;
      color: #0b0d0e;
    }
    .btn-refresh .badge-count {
      background: #3a4f58;
      color: #b8d4e0;
    }
    .btn-refresh.completed-all .badge-count {
      background: #4a7a7a;
      color: #b0d0d0;
    }
    .btn-hard.completed-all .badge-count {
      background: #4a4a4a;
      color: #888;
    }
    .reset-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #2f3f44;
      color: #7f9aa8;
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .reset-btn:active {
      transform: scale(0.94);
    }
    .footnote {
      margin-top: 12px;
      font-size: 11px;
      color: #50676f;
      text-align: center;
      letter-spacing: 0.2px;
    }
    .level-up {
      background: #263f3c;
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 12px;
      color: #c0f0e0;
      border: 1px solid #4d8a7a;
      display: inline-block;
      white-space: nowrap;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2f33;
      color: #d0edf0;
      padding: 10px 20px;
      border-radius: 60px;
      border: 1px solid #4a7a7a;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      backdrop-filter: blur(6px);
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    .empty-quests {
      padding: 20px 12px;
      text-align: center;
      color: #7e959f;
      font-size: 14px;
    }
    .empty-quests .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
    }
    .all-completed-notice {
      margin-top: 12px;
      padding: 8px 12px;
      background: #1a2f2a;
      border-radius: 16px;
      border: 1px solid #3a6a5a;
      text-align: center;
      font-size: 13px;
      color: #8ac0a0;
    }
    @media (max-width: 420px) {
      body { padding: 8px; }
      .app { padding: 14px 12px; border-radius: 24px; }
      h1 { font-size: 19px; gap: 6px; }
      h1 span { font-size: 12px; padding: 2px 10px; }
      .stats-grid { padding: 8px 10px; gap: 6px; }
      .stat-item { padding: 3px 10px 3px 8px; font-size: 11px; min-width: 60px; }
      .stat-item .value { font-size: 14px; }
      .quest-section { padding: 12px 10px; }
      .quest-item { padding: 10px 12px; }
      .quest-item .title { font-size: 13px; }
      .quest-item .desc { font-size: 11px; }
      .quest-item .badge { font-size: 11px; padding: 3px 10px; }
      .btn-done { font-size: 11px; padding: 5px 12px; }
      .btn-refresh, .btn-hard { font-size: 11px; padding: 6px 12px; min-width: 80px; }
      .badge-count { width: 18px; height: 18px; font-size: 10px; }
      .action-row .left-buttons { gap: 6px; }
      .toast { font-size: 12px; padding: 8px 16px; bottom: 16px; }
    }
    @media (max-width: 360px) {
      .stats-grid { flex-direction: column; gap: 4px; }
      .stat-item { width: 100%; }
      .quest-item { flex-direction: column; align-items: stretch; }
      .quest-item .badge { justify-content: space-between; }
      .btn-refresh, .btn-hard { min-width: 60px; font-size: 10px; padding: 5px 10px; }
    }
    @media (hover: none) {
      .btn-refresh:hover, .btn-hard:hover, .btn-done:hover, .reset-btn:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <h1>
    🧠⚡ Hero's Forge
    <span>v1</span>
  </h1>
  <div class="stats-grid" id="statsPanel">
    <div class="stat-item"><span class="label">🏋️ Уровень</span><span class="value" id="levelDisplay">1</span></div>
    <div class="stat-item"><span class="label">🧘 Очки</span><span class="value" id="xpDisplay">0 <small>XP</small></span></div>
    <div class="stat-item"><span class="label">🔥 Дней</span><span class="value" id="dayCounter">0</span></div>
  </div>

  <div class="quest-section">
    <div class="quest-header">
      <h2>📋 Квесты <span class="level-icon" id="difficultyLevel">⚡ Lv.1</span></h2>
      <span class="date" id="todayDate"></span>
    </div>
    <div id="questContainer"></div>
    <div class="action-row">
      <div class="left-buttons">
        <button class="btn-refresh" id="refreshQuestsBtn">
          🔄 Обновить
          <span class="badge-count" id="refreshBadge">2</span>
        </button>
        <button class="btn-hard" id="hardQuestBtn">
          ⭐ Сложный
          <span class="badge-count" id="hardQuestBadge">1</span>
        </button>
      </div>
      <span id="levelUpBadge" class="level-up" style="display: none;">⬆ Уровень +</span>
    </div>
  </div>

  <div class="reset-area">
    <button class="reset-btn" id="resetProgressBtn">⟳ Сбросить прогресс</button>
  </div>
  <div class="footnote">Каждый день — новые квесты для тела и ума</div>
</div>

<div id="toast" class="toast"></div>

<script>
  (function(){
    "use strict";

    // ---- РАСШИРЕННАЯ БАЗА КВЕСТОВ С АДЕКВАТНЫМИ ПРОМЕЖУТКАМИ ВРЕМЕНИ ----
    const QUEST_TEMPLATES = [
      // === ФИЗИЧЕСКИЕ КВЕСТЫ (17) ===
      { type: 'body', baseTitle: 'Отжимания', baseDesc: (lvl) => {
          const count = 10 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 20 },
      { type: 'body', baseTitle: 'Приседания', baseDesc: (lvl) => {
          const count = 15 + lvl * 3;
          const sets = 3 + Math.floor(lvl / 2);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 25 },
      { type: 'body', baseTitle: 'Планка', baseDesc: (lvl) => {
          const seconds = 30 + lvl * 5;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${seconds} секунд`;
        }, baseXp: 20 },
      { type: 'body', baseTitle: 'Бёрпи', baseDesc: (lvl) => {
          const count = 8 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 30 },
      { type: 'body', baseTitle: 'Выпады', baseDesc: (lvl) => {
          const count = 10 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 2);
          return `${sets} подхода по ${count} на ногу`;
        }, baseXp: 22 },
      { type: 'body', baseTitle: 'Мостик', baseDesc: (lvl) => {
          const count = 12 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 18 },
      { type: 'body', baseTitle: 'Подтягивания', baseDesc: (lvl) => {
          const max = 5 + Math.floor(lvl / 2);
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по макс. (${max}+)`;
        }, baseXp: 35 },
      { type: 'body', baseTitle: 'Скручивания на пресс', baseDesc: (lvl) => {
          const count = 20 + lvl * 3;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 22 },
      { type: 'body', baseTitle: 'Отжимания на трицепс', baseDesc: (lvl) => {
          const count = 8 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 25 },
      { type: 'body', baseTitle: 'Приседания с выпрыгиванием', baseDesc: (lvl) => {
          const count = 10 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 28 },
      { type: 'body', baseTitle: 'Боковая планка', baseDesc: (lvl) => {
          const seconds = 20 + lvl * 4;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${seconds} секунд на каждую сторону`;
        }, baseXp: 22 },
      { type: 'body', baseTitle: 'Ягодичный мостик', baseDesc: (lvl) => {
          const count = 15 + lvl * 3;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 20 },
      { type: 'body', baseTitle: 'Альпинист', baseDesc: (lvl) => {
          const count = 20 + lvl * 4;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 25 },
      { type: 'body', baseTitle: 'Супермен', baseDesc: (lvl) => {
          const seconds = 15 + lvl * 3;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${seconds} секунд`;
        }, baseXp: 18 },
      { type: 'body', baseTitle: 'Выпады назад', baseDesc: (lvl) => {
          const count = 10 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 2);
          return `${sets} подхода по ${count} на ногу`;
        }, baseXp: 24 },
      { type: 'body', baseTitle: 'Скалолаз', baseDesc: (lvl) => {
          const count = 15 + lvl * 3;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз`;
        }, baseXp: 26 },
      { type: 'body', baseTitle: 'Боковые скручивания', baseDesc: (lvl) => {
          const count = 15 + lvl * 2;
          const sets = 3 + Math.floor(lvl / 3);
          return `${sets} подхода по ${count} раз на сторону`;
        }, baseXp: 22 },

      // === МЕНТАЛЬНЫЕ КВЕСТЫ (17) С АДЕКВАТНЫМ ВРЕМЕНЕМ ===
      { type: 'mind', baseTitle: 'Чтение книги', baseDesc: (lvl) => {
          const minutes = 30 + lvl * 5;
          return `${minutes} минут чтения (≈${Math.round(minutes/60)} ч)`;
        }, baseXp: 25 },
      { type: 'mind', baseTitle: 'Глубокая медитация', baseDesc: (lvl) => {
          const minutes = 15 + lvl * 3;
          return `${minutes} минут осознанности`;
        }, baseXp: 22 },
      { type: 'mind', baseTitle: 'Изучение языка', baseDesc: (lvl) => {
          const minutes = 30 + lvl * 5;
          const words = 15 + lvl * 3;
          return `${minutes} мин (${Math.round(minutes/60)} ч) + ${words} новых слов`;
        }, baseXp: 30 },
      { type: 'mind', baseTitle: 'Тренировка памяти', baseDesc: (lvl) => {
          const count = 12 + lvl * 3;
          return `Запомнить ${count} чисел за 60 секунд`;
        }, baseXp: 22 },
      { type: 'mind', baseTitle: 'Логические задачи', baseDesc: (lvl) => {
          const count = 4 + Math.floor(lvl / 2);
          const minutes = 20 + lvl * 3;
          return `${count} задач за ${minutes} минут`;
        }, baseXp: 28 },
      { type: 'mind', baseTitle: 'Дневник рефлексии', baseDesc: (lvl) => {
          const minutes = 10 + Math.floor(lvl / 2) * 2;
          return `${minutes} минут рефлексии и планирования`;
        }, baseXp: 18 },
      { type: 'mind', baseTitle: 'Ментальная арифметика', baseDesc: (lvl) => {
          const minutes = 10 + lvl * 2;
          return `${minutes} минут счёта в уме и примеров`;
        }, baseXp: 20 },
      { type: 'mind', baseTitle: 'Судоку', baseDesc: (lvl) => {
          const count = 2 + Math.floor(lvl / 3);
          const minutes = 20 + lvl * 3;
          return `${count} головоломок за ${minutes} минут`;
        }, baseXp: 24 },
      { type: 'mind', baseTitle: 'Кроссворд', baseDesc: (lvl) => {
          const complexity = ['лёгкий', 'средний', 'сложный'][Math.min(2, Math.floor(lvl / 3))];
          const minutes = 25 + lvl * 4;
          return `${complexity} кроссворд за ${minutes} минут`;
        }, baseXp: 22 },
      { type: 'mind', baseTitle: 'Шахматы', baseDesc: (lvl) => {
          const minutes = 30 + lvl * 5;
          return `${minutes} минут (≈${Math.round(minutes/60)} ч) игры в шахматы`;
        }, baseXp: 30 },
      { type: 'mind', baseTitle: 'Изучение новых слов', baseDesc: (lvl) => {
          const count = 8 + lvl * 2;
          const minutes = 20 + lvl * 3;
          return `${count} новых слов за ${minutes} минут`;
        }, baseXp: 22 },
      { type: 'mind', baseTitle: 'Творческое письмо', baseDesc: (lvl) => {
          const minutes = 25 + lvl * 4;
          return `${minutes} минут свободного письма или блога`;
        }, baseXp: 25 },
      { type: 'mind', baseTitle: 'Аудиокнига / Подкаст', baseDesc: (lvl) => {
          const minutes = 45 + lvl * 5;
          return `${minutes} минут (≈${Math.round(minutes/60)} ч) прослушивания`;
        }, baseXp: 24 },
      { type: 'mind', baseTitle: 'Изучение новой темы', baseDesc: (lvl) => {
          const minutes = 40 + lvl * 5;
          return `${minutes} минут (≈${Math.round(minutes/60)} ч) изучения с конспектом`;
        }, baseXp: 28 },
      { type: 'mind', baseTitle: 'Анаграммы', baseDesc: (lvl) => {
          const count = 8 + lvl * 2;
          const minutes = 15 + lvl * 2;
          return `${count} анаграмм за ${minutes} минут`;
        }, baseXp: 22 },
      { type: 'mind', baseTitle: 'Планирование целей', baseDesc: (lvl) => {
          const count = 4 + Math.floor(lvl / 2);
          const minutes = 15 + lvl * 3;
          return `${count} целей на неделю за ${minutes} минут`;
        }, baseXp: 20 },
      { type: 'mind', baseTitle: 'Ментальная карта', baseDesc: (lvl) => {
          const items = 10 + lvl * 2;
          const minutes = 20 + lvl * 3;
          return `Карта с ${items} элементами за ${minutes} минут`;
        }, baseXp: 24 },
    ];

    // ---- РАСШИРЕННАЯ БАЗА СЛОЖНЫХ КВЕСТОВ ----
    const HARD_QUEST_POOL = [
      // Физические сложные
      { type: 'body', title: 'Интенсивная тренировка', desc: 'Отжимания 5×20, приседания 5×30, планка 3×60с', xp: 80 },
      { type: 'body', title: 'Челлендж на выносливость', desc: '100 отжиманий за 10 минут', xp: 90 },
      { type: 'body', title: 'Силовой комплекс', desc: 'Подтягивания 5×макс, бёрпи 5×15, выпады 5×15', xp: 85 },
      { type: 'body', title: 'Экстремальная планка', desc: '5 подходов по 90 секунд', xp: 75 },
      { type: 'body', title: 'Круговая тренировка', desc: '10 упражнений по 1 минуте, отдых 20 сек', xp: 95 },
      { type: 'body', title: 'Марафон приседаний', desc: '200 приседаний за 15 минут', xp: 80 },
      { type: 'body', title: 'Отжимания на брусьях', desc: '5 подходов по 15-20 раз', xp: 85 },
      { type: 'body', title: 'Тренировка на баланс', desc: 'Стойка на руках 3×45с + планка на одной руке', xp: 70 },
      // Ментальные сложные с адекватным временем
      { type: 'mind', title: 'Глубокая медитация', desc: '30-40 минут осознанности с фокусом на дыхание', xp: 75 },
      { type: 'mind', title: 'Интеллектуальный марафон', desc: '1.5-2 часа чтения сложной научной литературы', xp: 80 },
      { type: 'mind', title: 'Изучение языка: интенсив', desc: '1 час практики + запоминание 40 слов', xp: 85 },
      { type: 'mind', title: 'Когнитивный челлендж', desc: '15 сложных логических задач за 45 минут', xp: 90 },
      { type: 'mind', title: 'Двойной дневник', desc: '20 минут рефлексии + 20 минут планирования', xp: 70 },
      { type: 'mind', title: 'Шахматный турнир', desc: '5 партий с анализом ошибок (≈2 часа)', xp: 95 },
      { type: 'mind', title: 'Изучение сложной темы', desc: '1.5 часа изучения с подробным конспектом', xp: 85 },
      { type: 'mind', title: 'Публичное выступление', desc: 'Подготовка и запись 10-минутной речи', xp: 80 },
    ];

    const STORAGE_KEY = 'hero_forge_data';

    let state = {
      level: 1,
      xp: 0,
      dayCounter: 0,
      lastDate: null,
      completedToday: [],
      currentQuests: [],
      hardQuestUsed: false,
      hardQuestCompleted: false,
      hardQuestIndex: -1,
      refreshCount: 2,
      hardRefreshCount: 1,
    };

    const levelDisplay = document.getElementById('levelDisplay');
    const xpDisplay = document.getElementById('xpDisplay');
    const dayCounter = document.getElementById('dayCounter');
    const todayDate = document.getElementById('todayDate');
    const questContainer = document.getElementById('questContainer');
    const levelUpBadge = document.getElementById('levelUpBadge');
    const refreshBtn = document.getElementById('refreshQuestsBtn');
    const refreshBadge = document.getElementById('refreshBadge');
    const hardQuestBtn = document.getElementById('hardQuestBtn');
    const hardQuestBadge = document.getElementById('hardQuestBadge');
    const resetBtn = document.getElementById('resetProgressBtn');
    const toastEl = document.getElementById('toast');
    const difficultyLevel = document.getElementById('difficultyLevel');

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function formatDate(iso) {
      if (!iso) return '';
      const parts = iso.split('-');
      return `${parts[2]}.${parts[1]}`;
    }

    let toastTimeout = null;
    function showToast(message, duration = 2200) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    function generateDailyQuests(level) {
      const shuffled = [...QUEST_TEMPLATES].sort(() => Math.random() - 0.5);
      const count = Math.random() < 0.5 ? 4 : 5;
      const selected = shuffled.slice(0, count);
      return selected.map(template => {
        const xpMultiplier = 1 + (level - 1) * 0.15;
        const baseXp = template.baseXp || 20;
        const scaledXp = Math.round(baseXp * xpMultiplier);
        return {
          type: template.type,
          title: template.baseTitle,
          desc: template.baseDesc(level),
          xp: scaledXp,
        };
      });
    }

    function generateHardQuest(level) {
      const shuffled = [...HARD_QUEST_POOL].sort(() => Math.random() - 0.5);
      const baseQuest = shuffled[0];
      const xpMultiplier = 1 + (level - 1) * 0.1;
      const scaledXp = Math.round(baseQuest.xp * xpMultiplier);
      return { ...baseQuest, xp: scaledXp };
    }

    function recalcLevel() {
      const newLevel = Math.floor(state.xp / 100) + 1;
      if (newLevel > state.level) {
        state.level = newLevel;
        levelUpBadge.style.display = 'inline-block';
        showToast(`⬆ Уровень ${state.level}!`, 2500);
        setTimeout(() => { levelUpBadge.style.display = 'none'; }, 2800);
      } else {
        state.level = Math.max(1, newLevel);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          level: state.level,
          xp: state.xp,
          dayCounter: state.dayCounter,
          lastDate: state.lastDate,
          completedToday: state.completedToday,
          currentQuests: state.currentQuests,
          hardQuestUsed: state.hardQuestUsed,
          hardQuestCompleted: state.hardQuestCompleted,
          hardQuestIndex: state.hardQuestIndex,
          refreshCount: state.refreshCount,
          hardRefreshCount: state.hardRefreshCount,
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        state.level = data.level ?? 1;
        state.xp = data.xp ?? 0;
        state.dayCounter = data.dayCounter ?? 0;
        state.lastDate = data.lastDate ?? null;
        state.completedToday = data.completedToday ?? [];
        state.currentQuests = data.currentQuests ?? [];
        state.hardQuestUsed = data.hardQuestUsed ?? false;
        state.hardQuestCompleted = data.hardQuestCompleted ?? false;
        state.hardQuestIndex = data.hardQuestIndex ?? -1;
        state.refreshCount = data.refreshCount ?? 2;
        state.hardRefreshCount = data.hardRefreshCount ?? 1;
        return true;
      } catch (e) { return false; }
    }

    function initDay() {
      const today = getTodayStr();
      todayDate.textContent = formatDate(today);
      if (state.lastDate !== today || state.currentQuests.length === 0) {
        if (state.lastDate !== null && state.lastDate !== today) state.dayCounter += 1;
        if (state.lastDate === null) state.dayCounter = 0;
        state.currentQuests = generateDailyQuests(state.level);
        state.completedToday = [];
        state.hardQuestUsed = false;
        state.hardQuestCompleted = false;
        state.hardQuestIndex = -1;
        state.refreshCount = 2;
        state.hardRefreshCount = 1;
        state.lastDate = today;
        saveState();
      }
      if (state.currentQuests.length === 0) {
        state.currentQuests = generateDailyQuests(state.level);
        state.completedToday = [];
        saveState();
      }
    }

    function isAllQuestsCompleted() {
      const totalQuests = state.currentQuests.length;
      if (totalQuests === 0) return false;
      return state.completedToday.length === totalQuests;
    }

    function refreshQuests() {
      if (isAllQuestsCompleted()) {
        showToast('✅ Все квесты выполнены! Обновление недоступно до завтра.', 2500);
        return;
      }
      if (state.refreshCount <= 0) {
        showToast('⚠️ Лимит обновлений исчерпан (2/2)', 2000);
        return;
      }
      const today = getTodayStr();
      const newQuests = generateDailyQuests(state.level);
      const completedTitles = new Set();
      state.completedToday.forEach(index => {
        const q = state.currentQuests[index];
        if (q && !q.isHard) completedTitles.add(q.title);
      });
      const newCompleted = [];
      newQuests.forEach((q, idx) => {
        if (completedTitles.has(q.title)) newCompleted.push(idx);
      });
      let hasHard = false, hardData = null;
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const hq = state.currentQuests[state.hardQuestIndex];
        if (hq && hq.isHard) {
          if (!state.completedToday.includes(state.hardQuestIndex)) {
            hasHard = true;
            hardData = hq;
          } else {
            state.hardQuestCompleted = true;
            state.hardQuestUsed = true;
          }
        }
      }
      let final = [...newQuests], hIdx = -1;
      if (hasHard && hardData) { final.push(hardData); hIdx = final.length - 1; }
      state.currentQuests = final;
      state.completedToday = newCompleted;
      state.hardQuestIndex = hIdx;
      state.lastDate = today;
      state.refreshCount -= 1;
      if (state.hardQuestCompleted) state.hardQuestUsed = true;
      showToast(`🔄 Обновлено (осталось ${state.refreshCount}/2)`, 1800);
      recalcLevel();
      saveState();
      render();
    }

    function handleHardQuest() {
      if (isAllQuestsCompleted()) {
        showToast('✅ Все квесты выполнены! Обновление недоступно до завтра.', 2500);
        return;
      }
      if (state.hardRefreshCount <= 0) {
        showToast('⚠️ Лимит сложных квестов (1/1)', 2000);
        return;
      }
      if (state.hardQuestUsed && state.hardQuestCompleted) {
        showToast('⚠️ Сложный квест уже выполнен', 2000);
        return;
      }
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const existing = state.currentQuests[state.hardQuestIndex];
        if (existing && existing.isHard) {
          if (state.completedToday.includes(state.hardQuestIndex)) {
            showToast('⚠️ Сложный квест уже выполнен', 2000);
            return;
          }
          state.currentQuests.splice(state.hardQuestIndex, 1);
          state.hardQuestIndex = -1;
        }
      }
      const hardQuest = generateHardQuest(state.level);
      if (!hardQuest) { showToast('⚠️ Ошибка генерации', 1500); return; }
      const questWithMarker = { ...hardQuest, isHard: true };
      state.currentQuests.push(questWithMarker);
      state.hardQuestIndex = state.currentQuests.length - 1;
      state.hardQuestUsed = true;
      state.hardQuestCompleted = false;
      state.hardRefreshCount -= 1;
      showToast(`⭐ Сложный квест (осталось ${state.hardRefreshCount}/1)`, 2000);
      recalcLevel();
      saveState();
      render();
    }

    function render() {
      levelDisplay.textContent = state.level;
      xpDisplay.innerHTML = `${state.xp} <small>XP</small>`;
      dayCounter.textContent = state.dayCounter;
      difficultyLevel.textContent = `⚡ Lv.${state.level}`;

      const allCompleted = isAllQuestsCompleted();

      if (allCompleted) {
        refreshBtn.disabled = true;
        refreshBadge.textContent = '✓';
        refreshBadge.style.background = '#4a7a7a';
        refreshBtn.style.opacity = '0.6';
      } else {
        refreshBtn.disabled = state.refreshCount <= 0;
        refreshBadge.textContent = state.refreshCount;
        refreshBadge.style.background = '#3a4f58';
        refreshBtn.style.opacity = state.refreshCount <= 0 ? '0.4' : '1';
      }

      const isLocked = state.hardQuestCompleted;
      const isExhausted = state.hardRefreshCount <= 0;
      
      if (allCompleted) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '✓';
        hardQuestBadge.style.background = '#4a7a7a';
        hardQuestBtn.style.opacity = '0.6';
      } else if (isLocked) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '✓';
        hardQuestBadge.style.background = '#4a7a7a';
        hardQuestBtn.style.opacity = '0.5';
      } else if (isExhausted && state.hardQuestIndex >= 0) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '0';
        hardQuestBadge.style.background = '#4a4a4a';
        hardQuestBtn.style.opacity = '0.5';
      } else if (state.hardQuestIndex >= 0) {
        hardQuestBtn.disabled = false;
        hardQuestBadge.textContent = state.hardRefreshCount;
        hardQuestBadge.style.background = '#ff8a5c';
        hardQuestBtn.style.opacity = '1';
      } else {
        hardQuestBtn.disabled = false;
        hardQuestBadge.textContent = state.hardRefreshCount;
        hardQuestBadge.style.background = '#ff6b35';
        hardQuestBtn.style.opacity = '1';
      }

      if (!state.currentQuests || state.currentQuests.length === 0) {
        questContainer.innerHTML = `<div class="empty-quests"><span class="emoji">📭</span>Нет активных квестов</div>`;
        return;
      }

      let html = '';
      state.currentQuests.forEach((quest, index) => {
        const isDone = state.completedToday.includes(index);
        const doneClass = isDone ? 'completed' : '';
        const icon = quest.type === 'body' ? '💪' : '🧠';
        const hardClass = quest.isHard ? 'hard-quest' : '';
        const hardBadge = quest.isHard ? '<span class="hard-icon">⭐</span>' : '';
        const displayIcon = quest.isHard ? '🔥' : icon;
        html += `
          <div class="quest-item ${hardClass}" data-index="${index}">
            <div class="info">
              <div class="title">${displayIcon} ${quest.title} ${hardBadge}</div>
              <div class="desc">${quest.desc}</div>
            </div>
            <div class="badge">
              <span class="xp">+${quest.xp} XP</span>
              <button class="btn-done ${doneClass}" data-index="${index}" ${isDone ? 'disabled' : ''}>
                ${isDone ? '✓' : '✔'}
              </button>
            </div>
          </div>
        `;
      });
      questContainer.innerHTML = html;

      if (allCompleted) {
        const notice = document.createElement('div');
        notice.className = 'all-completed-notice';
        notice.textContent = '🎉 Все квесты выполнены! Обновление недоступно до завтра.';
        const container = questContainer;
        const existingNotice = container.querySelector('.all-completed-notice');
        if (!existingNotice) {
          container.appendChild(notice);
        }
      } else {
        const existingNotice = questContainer.querySelector('.all-completed-notice');
        if (existingNotice) existingNotice.remove();
      }

      document.querySelectorAll('.btn-done:not(.completed)').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const index = parseInt(this.dataset.index, 10);
          if (isNaN(index)) return;
          if (state.completedToday.includes(index)) return;
          const quest = state.currentQuests[index];
          if (!quest) return;
          state.xp += quest.xp;
          state.completedToday.push(index);
          if (quest.isHard) {
            state.hardQuestCompleted = true;
            state.hardQuestUsed = true;
            showToast(`⭐ +${quest.xp} XP`, 1500);
          } else {
            showToast(`✅ +${quest.xp} XP`, 1200);
          }
          recalcLevel();
          saveState();
          render();
        });
      });
      levelUpBadge.style.display = 'none';
    }

    function resetProgress() {
      if (confirm('Сбросить весь прогресс?')) {
        localStorage.removeItem(STORAGE_KEY);
        state.level = 1; state.xp = 0; state.dayCounter = 0; state.lastDate = null;
        state.completedToday = []; state.currentQuests = [];
        state.hardQuestUsed = false; state.hardQuestCompleted = false; state.hardQuestIndex = -1;
        state.refreshCount = 2; state.hardRefreshCount = 1;
        initDay(); render();
        showToast('🔄 Прогресс сброшен', 1800);
      }
    }

    function init() {
      loadState();
      initDay();
      recalcLevel();
      render();
      refreshBtn.addEventListener('click', refreshQuests);
      hardQuestBtn.addEventListener('click', handleHardQuest);
      resetBtn.addEventListener('click', resetProgress);
      setInterval(() => {
        const today = getTodayStr();
        if (state.lastDate !== today) {
          initDay();
          recalcLevel();
          render();
          showToast('🌅 Новый день!', 2000);
        }
      }, 3600000);
    }
    init();
  })();
</script>
</body>
</html>
