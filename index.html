<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Hero's Forge — прокачка тела и ума</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html { background: #0b0d0e; }
    body {
      background: #0b0d0e;
      color: #e8edf0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      position: relative;
      overflow-x: hidden;
      transition: filter 0.8s ease;
    }
    /* 🌑 Режим Дятла — весь экран чёрно-белый */
    body.wyvern-mode {
      filter: grayscale(100%) contrast(1.15);
    }
    body.wyvern-mode::before {
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.07) 0%, transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.08) 0%, transparent 35%);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 140, 60, 0.10) 0%, transparent 35%),
        radial-gradient(circle at 100% 0%, rgba(255, 140, 60, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(255, 140, 60, 0.09) 0%, transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(255, 140, 60, 0.10) 0%, transparent 35%);
      transition: background 0.8s ease;
    }
    .app {
      max-width: 500px;
      width: 100%;
      background: #14181a;
      border-radius: 32px;
      padding: 20px 16px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      border: 1px solid #3a2a1a;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255, 140, 60, 0.15),
        0 0 12px rgba(255, 140, 60, 0.12),
        0 0 30px rgba(255, 140, 60, 0.06),
        inset 0 0 20px rgba(255, 140, 60, 0.03);
      transition: box-shadow 0.8s ease, border-color 0.8s ease;
    }
    body.wyvern-mode .app {
      border-color: #4a4a4a;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.9),
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 15px rgba(255, 255, 255, 0.15),
        0 0 40px rgba(255, 255, 255, 0.08),
        inset 0 0 30px rgba(255, 255, 255, 0.04);
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    h1 .title-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 span { background: #2a3135; padding: 2px 12px; border-radius: 100px; font-size: 14px; font-weight: 400; color: #b0c4d0; }
    .header-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn-header {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
      padding: 6px 9px;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      user-select: none;
    }
    .btn-header:active { transform: scale(0.95); }
    .btn-header:hover { background: #2a3f48; border-color: #5a8596; color: #e0f4ff; }
    .btn-header.shop-btn { background: #2a3a2a; border-color: #5a8a5a; color: #b0e0b0; }
    .btn-header.shop-btn:hover { background: #3a5a3a; border-color: #7aba7a; color: #d0f4d0; }
    .btn-header.battle-btn { background: #3a1f1f; border-color: #b03030; color: #f0a0a0; }
    .btn-header.battle-btn:hover { background: #5a2a2a; border-color: #d04040; color: #ffc0c0; }
    .btn-header.art-btn { background: #2a1f3a; border-color: #8050b0; color: #d0a0f0; }
    .btn-header.art-btn:hover { background: #3a2a5a; border-color: #a070d0; color: #e8c0ff; }

    .wallet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid #3a5a6a;
      margin: 14px 0 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    .wallet-left { display: flex; align-items: center; gap: 12px; }
    .soap-icon { font-size: 32px; line-height: 1; filter: drop-shadow(0 0 6px rgba(160, 216, 255, 0.5)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .wallet-info { display: flex; flex-direction: column; gap: 2px; }
    .wallet-label { font-size: 11px; color: #8aacbc; letter-spacing: 0.3px; text-transform: uppercase; font-weight: 500; }
    .wallet-value { font-size: 24px; font-weight: 700; color: #e0f4ff; letter-spacing: -0.5px; line-height: 1; text-shadow: 0 0 8px rgba(160, 216, 255, 0.4); }
    .wallet-value small { font-size: 13px; font-weight: 400; color: #7a9aac; margin-left: 4px; }
    .wallet-hint { font-size: 11px; color: #6a8a9a; text-align: right; line-height: 1.3; }

    .active-relic-banner {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #2a2a1a, #3a3a2a);
      border: 1px solid #6a6a3a;
      padding: 10px 16px;
      border-radius: 20px;
      margin-top: 10px;
      transition: all 0.8s ease;
    }
    /* 🦅 Реликвия Дятла активна — особый баннер */
    .active-relic-banner.wyvern-active {
      background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
      border-color: #888888;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 0 25px rgba(255, 255, 255, 0.15);
    }
    .relic-icon-big { font-size: 24px; line-height: 1; filter: drop-shadow(0 0 8px rgba(255, 215, 128, 0.6)); }
    .active-relic-banner.wyvern-active .relic-icon-big {
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }
    .relic-active-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .relic-active-name { font-size: 13px; font-weight: 600; color: #ffd780; }
    .active-relic-banner.wyvern-active .relic-active-name {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }
    .relic-active-desc { font-size: 11px; color: #b0a880; }
    .active-relic-banner.wyvern-active .relic-active-desc {
      color: #999;
      font-style: italic;
    }

    .mode-switcher {
      display: flex;
      gap: 6px;
      background: #1e2529;
      padding: 5px;
      border-radius: 60px;
      border: 1px solid #2f383d;
      margin: 14px 0 8px;
      position: relative;
    }
    .mode-switcher.locked::after {
      content: '🔒';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #8a9ba5;
      padding: 8px 6px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
      white-space: nowrap;
    }
    .mode-btn:active:not(:disabled) { transform: scale(0.96); }
    .mode-btn.active { background: #2a3b44; color: #e0f0fa; }
    .mode-btn.active[data-mode="mind"] { background: #2a3a44; color: #b0d8ff; }
    .mode-btn.active[data-mode="body"] { background: #3a2f24; color: #ffb088; }
    .mode-btn.active[data-mode="balance"] { background: #2a3b35; color: #b0e0c8; }
    .mode-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .mode-hint { text-align: center; font-size: 11px; color: #6a8a96; margin-bottom: 12px; min-height: 16px; }
    .mode-hint.locked-hint { color: #e0a080; }

    .stats-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 16px;
      background: #1e2529;
      padding: 12px 14px;
      border-radius: 28px;
      border: 1px solid #2f383d;
    }
    .stat-item {
      flex: 1 1 auto;
      min-width: 70px;
      background: #0b0d0e;
      padding: 4px 14px 4px 12px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2f383d;
      font-size: 13px;
    }
    .stat-item .label { font-size: 11px; color: #8a9ba5; white-space: nowrap; }
    .stat-item .value { font-weight: 600; font-size: 16px; color: #e0f0fa; white-space: nowrap; }
    .stat-item .value small { font-weight: 400; font-size: 11px; color: #7a8b96; margin-left: 2px; }

    .quest-section {
      background: #101618;
      border-radius: 28px;
      padding: 16px 14px;
      margin: 16px 0 20px;
      border: 1px solid #263034;
    }
    .quest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
    .quest-header h2 { font-weight: 500; font-size: 17px; color: #d0dfe8; display: flex; align-items: center; gap: 6px; }
    .quest-header .date { background: #1e292f; padding: 2px 12px; border-radius: 40px; font-size: 12px; color: #a0b8c4; white-space: nowrap; }
    .level-icon { font-size: 12px; color: #ffd700; margin-left: 2px; }
    .quest-item {
      background: #1b2429;
      padding: 12px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border-left: 4px solid #4f7a8c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quest-item.mind-quest { border-left-color: #5a8ac0; }
    .quest-item.body-quest { border-left-color: #c08a5a; }
    .quest-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 120px; }
    .quest-item .title { font-weight: 500; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .quest-item .desc { font-size: 12px; color: #a6bbc8; line-height: 1.3; }
    .quest-item .badge {
      background: #2a3b44;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #c8dde8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .quest-item .badge .xp { color: #b8d9b0; font-weight: 500; }
    .quest-item .badge .xp-boosted { color: #ffd780; font-weight: 700; }
    .quest-item .badge .soap-reward { color: #a0d8ff; font-weight: 500; }
    .quest-item .badge .soap-reward-big { color: #ffd780; font-weight: 700; }
    .quest-item.hard-quest { border-left-color: #ff6b35; background: #1f2a2e; box-shadow: 0 0 0 1px rgba(255, 107, 53, 0.18), 0 0 15px rgba(255, 107, 53, 0.12); }
    .quest-item.hard-quest .title { color: #ff8a5c; }
    .quest-item.hard-quest .badge { background: #2f3f3a; border: 1px solid #ff6b35; }
    .quest-item.hard-quest .badge .xp { color: #ffb088; }
    .quest-item.hard-quest .badge .xp-boosted { color: #ffd780; }
    .quest-item.hard-quest .badge .soap-reward-big { color: #ffd780; }
    .quest-item.hard-quest .btn-done { background: #3f2f28; border-color: #ff6b35; color: #ffb088; }
    .hard-icon { background: #ff6b35; color: #0b0d0e; padding: 1px 8px; border-radius: 16px; font-size: 9px; font-weight: 700; display: inline-block; }
    .boost-indicator { color: #ffd780; font-size: 10px; font-weight: 700; margin-left: 4px; }
    /* 🌑 Особый индикатор буста при Дятле */
    .boost-indicator.wyvern {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
      font-size: 11px;
      animation: wyvernPulse 2s ease-in-out infinite;
    }
    @keyframes wyvernPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .btn-done {
      background: #2b3f3a;
      border: none;
      color: #c0dfd0;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #3d5a55;
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .btn-done:active { transform: scale(0.94); }
    .btn-done.completed { background: #1f3a35; color: #7aa89b; border-color: #3b6a60; opacity: 0.7; pointer-events: none; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; justify-content: space-between; }
    .action-row .left-buttons { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .btn-refresh, .btn-hard {
      padding: 8px 14px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      flex: 1 1 auto;
      justify-content: center;
      min-width: 100px;
    }
    .btn-refresh { background: #1e2a30; border: 1px solid #3a4f58; color: #b8d4e0; }
    .btn-refresh:active:not(:disabled) { transform: scale(0.95); }
    .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-hard { background: #2f241e; border: 1px solid #ff6b35; color: #ffb088; }
    .btn-hard:active:not(:disabled) { transform: scale(0.95); }
    .btn-hard:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge-count {
      background: #3a4f58;
      color: #b8d4e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-hard .badge-count { background: #ff6b35; color: #0b0d0e; }
    .reset-area { display: flex; justify-content: flex-end; margin-top: 4px; }
    .reset-btn { background: transparent; border: 1px solid #2f3f44; color: #7f9aa8; padding: 6px 16px; border-radius: 60px; font-size: 12px; cursor: pointer; user-select: none; }
    .reset-btn:active { transform: scale(0.94); }
    .footnote { margin-top: 12px; font-size: 11px; color: #50676f; text-align: center; }
    .level-up {
      background: #263f3c;
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 12px;
      color: #c0f0e0;
      border: 1px solid #4d8a7a;
      display: inline-block;
      white-space: nowrap;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2f33;
      color: #d0edf0;
      padding: 10px 20px;
      border-radius: 60px;
      border: 1px solid #4a7a7a;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      backdrop-filter: blur(6px);
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    /* 🌑 Особый тост при Дятле */
    body.wyvern-mode .toast {
      background: #000000;
      color: #ffffff;
      border-color: #888888;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    .empty-quests { padding: 20px 12px; text-align: center; color: #7e959f; font-size: 14px; }
    .empty-quests .emoji { font-size: 36px; display: block; margin-bottom: 8px; }
    .all-completed-notice {
      margin-top: 12px;
      padding: 8px 12px;
      background: #1a2f2a;
      border-radius: 16px;
      border: 1px solid #3a6a5a;
      text-align: center;
      font-size: 13px;
      color: #8ac0a0;
    }
    .mode-locked-notice {
      margin-top: 8px;
      padding: 10px 14px;
      background: #2a1f1a;
      border-radius: 16px;
      border: 1px solid #7a4a2a;
      text-align: center;
      font-size: 12px;
      color: #e0a080;
      line-height: 1.4;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 12px;
      overflow-y: auto;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #14181a;
      border-radius: 32px;
      padding: 24px 20px;
      width: 100%;
      max-width: 500px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      border: 1px solid #3a2a1a;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(255, 140, 60, 0.15), 0 0 25px rgba(255, 140, 60, 0.15);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      margin: auto;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      position: sticky;
      top: 0;
      background: #14181a;
      padding-bottom: 8px;
      z-index: 2;
    }
    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #e0f0fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
      line-height: 1;
      padding: 0;
    }
    .modal-close:active { transform: scale(0.9); }

    .stat-block {
      background: #101618;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #263034;
    }
    .stat-block h3 {
      font-size: 13px;
      font-weight: 500;
      color: #8a9ba5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .big-numbers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .big-number {
      background: #1b2429;
      border-radius: 18px;
      padding: 12px 14px;
      border: 1px solid #2a3b44;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .big-number .num { font-size: 24px; font-weight: 700; color: #e0f0fa; letter-spacing: -0.5px; line-height: 1.1; }
    .big-number .num.mind-color { color: #8ab8e8; }
    .big-number .num.body-color { color: #e8b888; }
    .big-number .num.xp-color { color: #b8e0a0; }
    .big-number .num.soap-color { color: #a0d8ff; }
    .big-number .num.streak-color { color: #ffd780; }
    .big-number .num.win-color { color: #90e0a0; }
    .big-number .num.loss-color { color: #e09090; }
    .big-number .num.art-color { color: #d8a0e8; }
    .big-number .lbl { font-size: 11px; color: #8a9ba5; }
    .progress-line { margin-top: 10px; background: #1b2429; border-radius: 12px; padding: 10px 14px; border: 1px solid #2a3b44; }
    .progress-line .pl-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a6bbc8; margin-bottom: 8px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #0b0d0e; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #4a7a8c, #6a9aac); border-radius: 10px; transition: width 0.4s ease; }
    .quest-type-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .type-stat {
      background: #1b2429;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #2a3b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .type-stat .ts-header { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a6bbc8; font-weight: 500; }

    function getTodayStr() {

    function formatDate(iso) {
      if (!iso) return '';

    }
    let toastTimeout = null;
    function showToast(message, duration = 2200) {
      toastEl.textContent = message;

    }
    function getActiveRelic() {
      if (!state.activeRelic) return null;
      return SHOP_ITEMS.relics.find(r => r.id === state.activeRelic) || null;
    }
    function getBoostForQuest(quest) {
      const relic = getActiveRelic();
      if (!relic) return 0;
      // 🦅 Реликвия Дятла — буст ×100001 (т.е. 10 000 000%)
      if (relic.isWyvern) return 100; // +10000% в формуле (1 + 100 = ×101)... но нужно больше
      // Пересчитаем: boost хранится как коэффициент к добавке.
      // Обычные: boost=0.15 → ×1.15
      // Дятел: должен давать ×100001 (то есть +10000000%)
      // Но в формуле: xp * (1 + boost). Значит boost должен быть 100000.
      if (relic.isWyvern) return 100000;
      if (relic.type === 'mind' && quest.type !== 'mind') return 0;
      if (relic.type === 'body' && quest.type !== 'body') return 0;
      return relic.boost;
    }
    function getQuestXpWithBoost(quest) {
      return Math.round(quest.xp * (1 + getBoostForQuest(quest)));

    function updateStreakOnNewDay(oldDate, newDate) {
      if (!oldDate) { state.stats.streak = 0; return; }
      const oldD = new Date(oldDate + 'T00:00:00');
      const newD = new Date(newDate + 'T00:00:00');
      const diffDays = Math.round((newD - oldD) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) state.stats.streak = (state.stats.streak || 0) + 1;
      else if (diffDays > 1) {
        if (state.streakShield > 0 && diffDays === 2) {
          state.streakShield -= 1;
          state.stats.streak = (state.stats.streak || 0) + 1;
          showToast('🛡️ Щит серии использован!', 2500);
        } else state.stats.streak = 1;
      }
      if (state.stats.streak > (state.stats.bestStreak || 0)) state.stats.bestStreak = state.stats.streak;
    }
    function addActiveDay(dateStr) {
      if (!state.stats.activeDays) state.stats.activeDays = [];
      if (!state.stats.activeDays.includes(dateStr)) {
        state.stats.activeDays.push(dateStr);
        if (state.stats.activeDays.length > 60) state.stats.activeDays = state.stats.activeDays.slice(-60);
      }
    }
    function generateDailyQuests(level, mode) {
      const allowedTypes = (MODES[mode] || MODES.balance).questTypes;
      const filtered = QUEST_TEMPLATES.filter(t => allowedTypes.includes(t.type));
      const shuffled = [...filtered].sort(() => Math.random() - 0.5);
      const count = Math.random() < 0.5 ? 4 : 5;
      return shuffled.slice(0, Math.min(count, shuffled.length)).map(t => {
        const xpM = 1 + (level - 1) * 0.15;
        return { type: t.type, title: t.baseTitle, desc: t.baseDesc(level), xp: Math.round((t.baseXp || 20) * xpM) };
      });
    }
    function generateHardQuest(level, mode) {
      const allowedTypes = (MODES[mode] || MODES.balance).questTypes;
      const filtered = HARD_QUEST_POOL.filter(q => allowedTypes.includes(q.type));
      if (!filtered.length) return null;
      const base = [...filtered].sort(() => Math.random() - 0.5)[0];
      const xpM = 1 + (level - 1) * 0.1;
      return { ...base, xp: Math.round(base.xp * xpM) };
    }

    function initDay() {
      const today = getTodayStr();
      todayDate.textContent = formatDate(today);
      if (state.lastDate !== today || state.currentQuests.length === 0) {
        if (state.lastDate !== null && state.lastDate !== today) {
          updateStreakOnNewDay(state.lastDate, today);
          state.dayCounter += 1;

    function isAllQuestsCompleted() {

    function switchMode(newMode) {

      state.mode = newMode;

      modeHint.textContent = MODES[newMode].hint;
      state.currentQuests = generateDailyQuests(state.level, newMode);

    function refreshQuests() {
      if (isAllQuestsCompleted()) { showToast('✅ Все выполнены!', 2500); return; }
      if (state.refreshCount <= 0) { showToast('⚠️ Лимит исчерпан', 2000); return; }
      const today = getTodayStr();
      const newQuests = generateDailyQuests(state.level, state.mode);
      const completedTitles = new Set();
      state.completedToday.forEach(i => { const q = state.currentQuests[i]; if (q && !q.isHard) completedTitles.add(q.title); });
      const newCompleted = [];
      newQuests.forEach((q, i) => { if (completedTitles.has(q.title)) newCompleted.push(i); });
      let hasHard = false, hardData = null;
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const hq = state.currentQuests[state.hardQuestIndex];
        if (hq && hq.isHard) {
          if (!state.completedToday.includes(state.hardQuestIndex)) { hasHard = true; hardData = hq; }
          else { state.hardQuestCompleted = true; state.hardQuestUsed = true; }
        }
      }
      let final = [...newQuests], hIdx = -1;
      if (hasHard && hardData) { final.push(hardData); hIdx = final.length - 1; }
      state.currentQuests = final;
      state.completedToday = newCompleted;
      state.hardQuestIndex = hIdx;
      state.lastDate = today;
      state.refreshCount -= 1;
      if (state.hardQuestCompleted) state.hardQuestUsed = true;
      showToast(`🔄 Осталось ${state.refreshCount}/2`, 1800);
      recalcLevel(); saveState(); render();

    function handleHardQuest() {
      if (isAllQuestsCompleted()) { showToast('✅ Все выполнены!', 2500); return; }
      if (state.hardRefreshCount <= 0) { showToast('⚠️ Лимит', 2000); return; }
      if (state.hardQuestUsed && state.hardQuestCompleted) { showToast('⚠️ Уже выполнен', 2000); return; }
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const ex = state.currentQuests[state.hardQuestIndex];
        if (ex && ex.isHard) {
          if (state.completedToday.includes(state.hardQuestIndex)) { showToast('⚠️ Уже выполнен', 2000); return; }
          state.currentQuests.splice(state.hardQuestIndex, 1);
          state.hardQuestIndex = -1;
        }
      }
      const hardQuest = generateHardQuest(state.level, state.mode);
      if (!hardQuest) { showToast('⚠️ Нет сложных', 1800); return; }
      const qwm = { ...hardQuest, isHard: true };
      state.currentQuests.push(qwm);
      state.hardQuestIndex = state.currentQuests.length - 1;
      state.hardQuestUsed = true;
      state.hardQuestCompleted = false;
      state.hardRefreshCount -= 1;
      showToast(`⭐ Сложный (осталось ${state.hardRefreshCount}/1)`, 2000);
      recalcLevel(); saveState(); render();
    }
    function completeQuest(index) {
      if (state.completedToday.includes(index)) return;
      const quest = state.currentQuests[index];
      if (!quest) return;
      const boostedXp = getQuestXpWithBoost(quest);
      const boost = getBoostForQuest(quest);
      const soapReward = getQuestSoapReward(quest);
      state.xp += boostedXp;
      state.completedToday.push(index);
      if (!state.modeLocked) state.modeLocked = true;
      state.soap += soapReward;
      state.stats.totalSoapEarned += soapReward;
      state.stats.totalCompleted += 1;
      state.stats.totalXpEarned += boostedXp;
      if (quest.isHard) state.stats.hardCompleted += 1;
      else if (quest.type === 'mind') state.stats.mindCompleted += 1;
      else if (quest.type === 'body') state.stats.bodyCompleted += 1;
      addActiveDay(getTodayStr());
      const bT = boost > 0 ? ` (🔥+${Math.round(boost * 100)}%)` : '';
      const lT = state.modeLocked ? ' • 🔒' : '';
      if (quest.isHard) {
        state.hardQuestCompleted = true;
        state.hardQuestUsed = true;
        showToast(`⭐ +${boostedXp} XP${bT} • +${soapReward} 🧼`, 2200);

      else if (isExhausted && state.hardQuestIndex >= 0) { hardQuestBtn.disabled = true; hardQuestBadge.textContent = '0'; hardQuestBadge.style.background = '#4a4a4a'; hardQuestBtn.style.opacity = '0.5'; }
      else if (state.hardQuestIndex >= 0) { hardQuestBtn.disabled = false; hardQuestBadge.textContent = state.hardRefreshCount; hardQuestBadge.style.background = '#ff8a5c'; hardQuestBtn.style.opacity = '1'; }
      else { hardQuestBtn.disabled = false; hardQuestBadge.textContent = state.hardRefreshCount; hardQuestBadge.style.background = '#ff6b35'; hardQuestBtn.style.opacity = '1'; }

    function buyRelic(id) {
      const r = SHOP_ITEMS.relics.find(x => x.id === id);
      if (!r) return;
      if (state.ownedRelics.includes(id)) { showToast('⚠️ Уже куплена', 1800); return; }
      if (state.soap < r.price) { showToast('⚠️ Недостаточно мыла', 1800); return; }
      
      // 🦅 Особое подтверждение для Дятла
      if (r.isWyvern) {
        if (!confirm(`⚠️ ВНИМАНИЕ ⚠️\n\nКупить "Реликвию Дятла" за ${r.price.toLocaleString('ru-RU')} 🧼?\n\nТот, кто возьмёт эту реликвию, познает на себе её силу. Подобно рассекающему плоть клинку, она будет терзать его душу.\n\nВесь Hero's Forge навсегда изменится...`)) return;
      } else {
        if (!confirm(`Купить "${r.name}" за ${r.price} 🧼?`)) return;
      }
      
      state.soap -= r.price; state.stats.totalSoapSpent += r.price;
      state.ownedRelics.push(id);
      if (!state.activeRelic) { 
        state.activeRelic = id;

    function activateRelic(id) {
      if (!state.ownedRelics.includes(id)) return;
      const r = SHOP_ITEMS.relics.find(x => x.id === id);
      if (!r) return;
      state.activeRelic = id; 
      saveState(); 
      render(); 
      renderShop();
      // 🌑 Применяем/снимаем режим Дятла
      applyWyvernMode();
      if (r.isWyvern) {
        showToast(`🦅 ТЬМА ПОГЛОТИЛА FORGE...`, 3500);
      } else {
        showToast(`${r.icon} ${r.name} активирована!`, 2000);
      }

    function exchangeXpForSoap() {
      if (state.xp < XP_TO_SOAP_RATE) { showToast(`⚠️ Нужно ${XP_TO_SOAP_RATE} XP`, 2000); return; }
      const ex = Math.floor(state.xp / XP_TO_SOAP_RATE);
      const totalXp = ex * XP_TO_SOAP_RATE;
      const totalSoap = ex * SOAP_REWARD;
      if (!confirm(`Обменять ${totalXp} XP на ${totalSoap} 🧼?\n\nУровень может понизиться!`)) return;
      state.xp -= totalXp; state.soap += totalSoap;
      state.stats.totalXpExchanged += totalXp;
      state.stats.totalSoapEarned += totalSoap;
      const nl = Math.floor(state.xp / 100) + 1;
      const oldL = state.level;
      state.level = Math.max(1, nl);
      if (state.level < oldL) showToast(`📉 Уровень понижен: ${oldL} → ${state.level}`, 2500);
      else if (state.level > oldL) { levelUpBadge.style.display = 'inline-block'; showToast(`⬆ Уровень ${state.level}!`, 2500); setTimeout(() => { levelUpBadge.style.display = 'none'; }, 2800); }
      saveState(); render(); renderShop();
      showToast(`💱 ${totalXp} XP → ${totalSoap} 🧼`, 2500);
    }
    function buyConsumable(id) {
      const item = SHOP_ITEMS.consumables.find(x => x.id === id);
      if (!item) return;
      if (state.soap < item.price) { showToast('⚠️ Недостаточно мыла', 1800); return; }
      if (!confirm(`Купить "${item.name}" за ${item.price} 🧼?`)) return;
      state.soap -= item.price;
      state.stats.totalSoapSpent += item.price;
      let msg = '';
      switch(id) {
        case 'extra_refresh': state.refreshCount += 1; msg = `+1 обновление (${state.refreshCount})`; break;
        case 'extra_hard': state.hardRefreshCount += 1; msg = `+1 сложный (${state.hardRefreshCount})`; break;
        case 'instant_xp': { const xp = item.xpReward || 100; state.xp += xp; state.stats.totalXpEarned += xp; recalcLevel(); msg = `+${xp} XP`; break; }

      }
      saveState(); render(); renderShop();
      showToast(`${item.icon} ${msg}`, 2400);
    }

    // ПОЕДИНКИ (сокращённо)
    function getBattleData() {
      return {
        v: 1, lvl: state.level, xp: state.xp, soap: state.soap,
        totalXp: state.stats.totalXpEarned, totalQ: state.stats.totalCompleted,
        mind: state.stats.mindCompleted, body: state.stats.bodyCompleted,
        hard: state.stats.hardCompleted, streak: state.stats.streak,
        best: state.stats.bestStreak, relics: state.ownedRelics.length,
        days: state.dayCounter, br: state.battleRecord.wins,
      };
    }
    function encodeBattleCode() {
      try {
        const data = getBattleData();
        const json = JSON.stringify(data);
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return BATTLE_CODE_PREFIX + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      } catch (e) { return null; }
    }
    function decodeBattleCode(code) {
      try {
        code = code.trim();
        if (!code.startsWith(BATTLE_CODE_PREFIX)) return null;
        let b64 = code.slice(BATTLE_CODE_PREFIX.length);
        b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        const data = JSON.parse(json);
        if (typeof data.lvl !== 'number' || typeof data.xp !== 'number') return null;
        return data;
      } catch (e) { return null; }
    }
    function compareBattles(me, enemy) {
      const cats = [
        { key: 'lvl', label: 'Уровень', icon: '🏋️', me: me.lvl, enemy: enemy.lvl },
        { key: 'totalXp', label: 'Всего XP', icon: '🧘', me: me.totalXp, enemy: enemy.totalXp },
        { key: 'totalQ', label: 'Квестов', icon: '📋', me: me.totalQ, enemy: enemy.totalQ },
        { key: 'mind', label: 'Ум', icon: '🧠', me: me.mind, enemy: enemy.mind },

        { key: 'soap', label: 'Мыло', icon: '🧼', me: me.soap, enemy: enemy.soap },
      ];

    }
    function renderArtViewer() {
      const art = canvasState.viewingArt;
      if (!art) { canvasState.currentView = 'menu'; renderArt(); return; }
      const sizeKB = Math.round(art.dataUrl.length / 1024);
      let html = `<div class="art-viewer-canvas-wrap"><img src="${art.dataUrl}" alt="art"></div><div class="art-viewer-meta"><div class="art-viewer-date">📅 ${formatDate(art.date)} • ~${sizeKB} КБ</div><button class="like-btn ${canvasState.isLiked ? 'liked' : ''}" id="artLikeBtn">${canvasState.isLiked ? '❤️ Понравилось' : '🤍 Нравится'} (${art.likes || 0})</button></div><div class="art-viewer-actions"><button class="art-action-btn-small primary" id="artShareBtn" style="flex:1;justify-content:center;">📤 Поделиться</button><button class="art-action-btn-small" id="artViewerBack">← Назад</button></div><div id="artShareArea"></div>`;
      artContent.innerHTML = html;
      document.getElementById('artViewerBack').addEventListener('click', () => { canvasState.viewingArt = null; canvasState.currentView = 'gallery'; renderArt(); });
      document.getElementById('artLikeBtn').addEventListener('click', () => {
        if (canvasState.isLiked) { showToast('⚠️ Вы уже поставили лайк', 1800); return; }
        canvasState.isLiked = true;
        const myArt = artGallery.find(a => a.id === art.id);
        if (myArt) { myArt.likes = (myArt.likes || 0) + 1; saveArtGallery(); }
        state.stats.artLikesGiven = (state.stats.artLikesGiven || 0) + 1;
        saveState(); renderArtViewer(); render();
        showToast('❤️ Лайк поставлен!', 1500);
      });
      document.getElementById('artShareBtn').addEventListener('click', () => showArtShareMenu(art));
    }
    function showArtShareMenu(art) {
      const area = document.getElementById('artShareArea');
      area.innerHTML = `
        <div class="battle-code-hint" style="color:#b8a0c8;margin-top:10px;margin-bottom:10px;">Выбери способ:</div>
        <button class="battle-action-btn share" id="artShareShortBtn" style="width:100%;margin-bottom:8px;">📤 Короткий код (интернет)</button>
        <button class="battle-action-btn fight" id="artShareLongBtn" style="width:100%;">📋 Полный код (оффлайн)</button>
        <div id="artShareResult" style="margin-top:10px;"></div>
      `;
      document.getElementById('artShareShortBtn').addEventListener('click', () => uploadArtToHost(art));
      document.getElementById('artShareLongBtn').addEventListener('click', () => showLongCode(art));
    }
    async function uploadArtToHost(art) {
      const resultArea = document.getElementById('artShareResult');
      resultArea.innerHTML = `<div class="upload-status"><span class="loading-spinner"></span> Загрузка... (2-5 сек)</div>`;
      try {
        const blob = await (await fetch(art.dataUrl)).blob();
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        const file = new File([blob], 'art.jpg', { type: 'image/jpeg' });
        formData.append('fileToUpload', file);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        const response = await fetch(IMAGE_HOST_UPLOAD, { method: 'POST', body: formData, signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('Upload failed');
        const fileUrl = (await response.text()).trim();
        if (!fileUrl || !fileUrl.startsWith('http')) throw new Error('Bad response');
        const match = fileUrl.match(/\/([a-z0-9]+)\.(jpg|jpeg|png|gif|webp)$/i);
        if (!match) throw new Error('Bad URL');
        const shortId = match[1];
        const shortCode = ART_CODE_PREFIX + shortId;
        art.shared = shortCode;
        art.hostUrl = fileUrl;
        saveArtGallery();
        resultArea.innerHTML = `
          <div class="share-success-banner"><span class="icon">✅</span><div class="text">Загружено!</div><div class="subtext">Код для отправки:</div></div>
          <div class="short-code-display" id="shortCodeEl"><div class="short-code-text">${shortCode}</div><div class="hint">👆 Нажми, чтобы скопировать</div></div>
        `;
        const codeEl = document.getElementById('shortCodeEl');
        codeEl.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(shortCode); showToast(`📋 ${shortCode} скопирован!`, 2200); }
          catch (e) {
            const r = document.createRange(); r.selectNode(codeEl);
            window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
            try { document.execCommand('copy'); showToast(`📋 ${shortCode}!`, 2200); }
            catch (err) { showToast('⚠️ Скопируйте вручную', 2000); }
          }
        });
        showToast(`✅ Код: ${shortCode}`, 3000);
      } catch (err) {
        console.error(err);
        resultArea.innerHTML = `<div class="share-success-banner" style="background: linear-gradient(135deg, #3a1a1a, #4a2a2a); border-color: #9a5a5a;"><span class="icon">⚠️</span><div class="text" style="color:#f0c0c0;">Не удалось</div><div class="subtext" style="color:#c09090;">Проверь интернет или используй полный код</div></div><button class="battle-submit-btn" id="fallbackToLongBtn" style="margin-top:10px;">📋 Полный код</button>`;
        document.getElementById('fallbackToLongBtn').addEventListener('click', () => showLongCode(art));
      }
    }
    function showLongCode(art) {
      const resultArea = document.getElementById('artShareResult');
      const code = encodeArtCodeFull(art);
      if (!code) { showToast('⚠️ Ошибка', 1500); return; }
      const codeSize = Math.round(code.length / 1024);
      resultArea.innerHTML = `<div class="battle-code-hint" style="color:#b8a0c8;margin-bottom:8px;">📏 ~${codeSize} КБ — работает без интернета</div><div class="art-share-code" id="artShareCode">${code}</div><div class="battle-code-hint" style="color:#b8a0c8;">👆 Нажмите, чтобы скопировать</div>`;
      const codeEl = document.getElementById('artShareCode');
      codeEl.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(code); showToast(`📋 Скопировано! (${codeSize} КБ)`, 2200); }
        catch (e) {
          const r = document.createRange(); r.selectNode(codeEl);
          window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
          try { document.execCommand('copy'); showToast(`📋 Скопировано!`, 2200); }
          catch (err) { showToast('⚠️ Скопируйте вручную', 2000); }
        }
      });
    }
    function encodeArtCodeFull(art) {
      try {
        const data = { v: 2, d: art.date, l: art.likes || 0, img: art.dataUrl };
        const json = JSON.stringify(data);
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return ART_FULL_PREFIX + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      } catch (e) { return null; }
    }
    async function decodeArtCode(code) {
      try {
        code = code.trim();
        if (code.startsWith(ART_CODE_PREFIX)) {
          const shortId = code.slice(ART_CODE_PREFIX.length).trim();
          if (!/^[a-z0-9]+$/i.test(shortId)) return null;
          const imageUrl = IMAGE_HOST_VIEW + shortId + '.jpg';
          const response = await fetch(imageUrl);
          if (!response.ok) {
            const pngUrl = IMAGE_HOST_VIEW + shortId + '.png';
            const pngResponse = await fetch(pngUrl);
            if (!pngResponse.ok) return null;
            const blob = await pngResponse.blob();
            const dataUrl = await blobToDataURL(blob);
            return { id: 'external_' + Date.now(), dataUrl, date: getTodayStr(), likes: 0, external: true };
          }
          const blob = await response.blob();
          const dataUrl = await blobToDataURL(blob);
          return { id: 'external_' + Date.now(), dataUrl, date: getTodayStr(), likes: 0, external: true };
        }
        let b64;
        if (code.startsWith(ART_FULL_PREFIX)) b64 = code.slice(ART_FULL_PREFIX.length);
        else if (code.startsWith('A2-')) b64 = code.slice(3);
        else if (code.startsWith('ART1-')) b64 = code.slice(5);
        else return null;
        b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        const data = JSON.parse(json);
        if (!data.img || typeof data.img !== 'string') return null;
        return { id: 'external_' + Date.now(), dataUrl: data.img, date: data.d || getTodayStr(), likes: data.l || 0, external: true };
      } catch (e) { return null; }
    }
    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function resetProgress() {
      if (confirm('Сбросить весь прогресс? (включая галерею)')) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(ART_STORAGE_KEY);
        artGallery = [];
        state = {
          level: 1, xp: 0, dayCounter: 0, lastDate: null,
          completedToday: [], currentQuests: [],
          hardQuestUsed: false, hardQuestCompleted: false, hardQuestIndex: -1,
          refreshCount: 2, hardRefreshCount: 1, mode: 'balance',
          soap: 0, ownedRelics: [], activeRelic: null, streakShield: 0,
          modeLocked: false,
          battleHistory: [], battleRecord: { wins: 0, losses: 0, draws: 0 },
          artLastRewardDate: null,
          stats: { totalCompleted: 0, mindCompleted: 0, bodyCompleted: 0, hardCompleted: 0, totalXpEarned: 0, streak: 0, bestStreak: 0, activeDays: [], totalSoapEarned: 0, totalSoapSpent: 0, totalXpExchanged: 0, artPieces: 0, artLikesReceived: 0, artLikesGiven: 0 },
        };
        document.body.classList.remove('wyvern-mode');
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === 'balance'));
        modeHint.textContent = MODES.balance.hint;
        modeHint.classList.remove('locked-hint');
        modeSwitcher.classList.remove('locked');
        initDay(); render();
        closeStats(); closeShop(); closeBattle(); closeArt();
        showToast('🔄 Сброшено', 1800);
      }
    }

    function init() {
      loadState();
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
      modeHint.textContent = MODES[state.mode].hint;
      initDay();
      recalcLevel();
      render();
      modeSwitcher.addEventListener('click', function(e) {
        const btn = e.target.closest('.mode-btn');
        if (!btn || btn.disabled) return;
        switchMode(btn.dataset.mode);
      });
      refreshBtn.addEventListener('click', refreshQuests);
      hardQuestBtn.addEventListener('click', handleHardQuest);
      resetBtn.addEventListener('click', resetProgress);
      statsBtn.addEventListener('click', openStats);
      statsCloseBtn.addEventListener('click', closeStats);
      shopBtn.addEventListener('click', openShop);
      shopCloseBtn.addEventListener('click', closeShop);
      battleBtn.addEventListener('click', openBattle);
      battleCloseBtn.addEventListener('click', closeBattle);
      artBtn.addEventListener('click', openArt);
      artCloseBtn.addEventListener('click', closeArt);
      statsModal.addEventListener('click', e => { if (e.target === statsModal) closeStats(); });
      shopModal.addEventListener('click', e => { if (e.target === shopModal) closeShop(); });
      battleModal.addEventListener('click', e => { if (e.target === battleModal) closeBattle(); });
      artModal.addEventListener('click', e => { if (e.target === artModal) closeArt(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeStats(); closeShop(); closeBattle(); closeArt(); }
      });
      setInterval(() => {
        const today = getTodayStr();
        if (state.lastDate !== today) {
          initDay(); recalcLevel(); render();
          showToast('🌅 Новый день!', 2400);
        }
      }, 3600000);
    }
    init();
  })();
</script>
</body>
</html>
