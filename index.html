<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚡ Hero's Forge — прокачка тела и ума</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: #0b0d0e;
      color: #e8edf0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }
    .app {
      max-width: 500px;
      width: 100%;
      background: #14181a;
      border-radius: 32px;
      padding: 20px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border: 1px solid #2a3135;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    h1 .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #2a3135;
      padding: 2px 12px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 400;
      color: #b0c4d0;
    }
    .header-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-header {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
      padding: 6px 12px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .btn-header:active { transform: scale(0.95); }
    .btn-header:hover {
      background: #2a3f48;
      border-color: #5a8596;
      color: #e0f4ff;
    }
    .btn-header.shop-btn {
      background: #2a3a2a;
      border-color: #5a8a5a;
      color: #b0e0b0;
    }
    .btn-header.shop-btn:hover {
      background: #3a5a3a;
      border-color: #7aba7a;
      color: #d0f4d0;
    }

    .wallet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid #3a5a6a;
      margin: 14px 0 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    .wallet-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .soap-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .wallet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .wallet-label {
      font-size: 11px;
      color: #8aacbc;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .wallet-value {
      font-size: 24px;
      font-weight: 700;
      color: #e0f4ff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .wallet-value small {
      font-size: 13px;
      font-weight: 400;
      color: #7a9aac;
      margin-left: 4px;
    }
    .wallet-hint {
      font-size: 11px;
      color: #6a8a9a;
      text-align: right;
      line-height: 1.3;
    }

    .active-relic-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2a2a1a, #3a3a2a);
      border: 1px solid #6a6a3a;
      padding: 10px 16px;
      border-radius: 20px;
      margin-top: 10px;
    }
    .relic-icon-big { font-size: 24px; line-height: 1; }
    .relic-active-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .relic-active-name { font-size: 13px; font-weight: 600; color: #ffd780; }
    .relic-active-desc { font-size: 11px; color: #b0a880; }

    .mode-switcher {
      display: flex;
      gap: 6px;
      background: #1e2529;
      padding: 5px;
      border-radius: 60px;
      border: 1px solid #2f383d;
      margin: 14px 0 8px;
      position: relative;
    }
    .mode-switcher.locked::after {
      content: '🔒';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #8a9ba5;
      padding: 8px 6px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      white-space: nowrap;
    }
    .mode-btn:active:not(:disabled) { transform: scale(0.96); }
    .mode-btn.active {
      background: #2a3b44;
      color: #e0f0fa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .mode-btn.active[data-mode="mind"] {
      background: #2a3a44;
      color: #b0d8ff;
    }
    .mode-btn.active[data-mode="body"] {
      background: #3a2f24;
      color: #ffb088;
    }
    .mode-btn.active[data-mode="balance"] {
      background: #2a3b35;
      color: #b0e0c8;
    }
    .mode-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .mode-hint {
      text-align: center;
      font-size: 11px;
      color: #6a8a96;
      margin-bottom: 12px;
      min-height: 16px;
      letter-spacing: 0.2px;
    }
    .mode-hint.locked-hint { color: #e0a080; }
    .stats-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 16px;
      background: #1e2529;
      padding: 12px 14px;
      border-radius: 28px;
      border: 1px solid #2f383d;
    }
    .stat-item {
      flex: 1 1 auto;
      min-width: 70px;
      background: #0b0d0e;
      padding: 4px 14px 4px 12px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2f383d;
      font-size: 13px;
    }
    .stat-item .label { font-size: 11px; color: #8a9ba5; white-space: nowrap; }
    .stat-item .value {
      font-weight: 600;
      font-size: 16px;
      color: #e0f0fa;
      white-space: nowrap;
    }
    .stat-item .value small {
      font-weight: 400;
      font-size: 11px;
      color: #7a8b96;
      margin-left: 2px;
    }
    .quest-section {
      background: #101618;
      border-radius: 28px;
      padding: 16px 14px;
      margin: 16px 0 20px;
      border: 1px solid #263034;
    }
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quest-header h2 {
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.2px;
      color: #d0dfe8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quest-header .date {
      background: #1e292f;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #a0b8c4;
      white-space: nowrap;
    }
    .level-icon {
      font-size: 12px;
      color: #ffd700;
      margin-left: 2px;
    }
    .quest-item {
      background: #1b2429;
      padding: 12px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border-left: 4px solid #4f7a8c;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quest-item:last-child { margin-bottom: 0; }
    .quest-item.mind-quest { border-left-color: #5a8ac0; }
    .quest-item.body-quest { border-left-color: #c08a5a; }
    .quest-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 120px;
    }
    .quest-item .title {
      font-weight: 500;
      font-size: 15px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .quest-item .desc { font-size: 12px; color: #a6bbc8; line-height: 1.3; }
    .quest-item .badge {
      background: #2a3b44;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 12px;
      color: #c8dde8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .quest-item .badge .xp { color: #b8d9b0; font-weight: 500; }
    .quest-item .badge .xp-boosted { color: #ffd780; font-weight: 700; }
    .quest-item .badge .soap-reward { color: #a0d8ff; font-weight: 500; }
    .quest-item .badge .soap-reward-big { color: #ffd780; font-weight: 700; }
    .quest-item.hard-quest {
      border-left-color: #ff6b35;
      background: #1f2a2e;
    }
    .quest-item.hard-quest .title { color: #ff8a5c; }
    .quest-item.hard-quest .badge {
      background: #2f3f3a;
      border: 1px solid #ff6b35;
    }
    .quest-item.hard-quest .badge .xp { color: #ffb088; }
    .quest-item.hard-quest .badge .xp-boosted { color: #ffd780; font-weight: 700; }
    .quest-item.hard-quest .badge .soap-reward-big { color: #ffd780; }
    .quest-item.hard-quest .btn-done {
      background: #3f2f28;
      border-color: #ff6b35;
      color: #ffb088;
    }
    .hard-icon {
      background: #ff6b35;
      color: #0b0d0e;
      padding: 1px 8px;
      border-radius: 16px;
      font-size: 9px;
      font-weight: 700;
      display: inline-block;
    }
    .boost-indicator {
      color: #ffd780;
      font-size: 10px;
      font-weight: 700;
      margin-left: 4px;
    }
    .btn-done {
      background: #2b3f3a;
      border: none;
      color: #c0dfd0;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #3d5a55;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .btn-done:active { transform: scale(0.94); }
    .btn-done.completed {
      background: #1f3a35;
      color: #7aa89b;
      border-color: #3b6a60;
      opacity: 0.7;
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .action-row .left-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .btn-refresh, .btn-hard {
      padding: 8px 14px;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      flex: 1 1 auto;
      justify-content: center;
      min-width: 100px;
    }
    .btn-refresh {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
    }
    .btn-refresh:active:not(:disabled) { transform: scale(0.95); }
    .btn-refresh:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-hard {
      background: #2f241e;
      border: 1px solid #ff6b35;
      color: #ffb088;
    }
    .btn-hard:active:not(:disabled) { transform: scale(0.95); }
    .btn-hard:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .badge-count {
      background: #3a4f58;
      color: #b8d4e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-hard .badge-count {
      background: #ff6b35;
      color: #0b0d0e;
    }
    .reset-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #2f3f44;
      color: #7f9aa8;
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .reset-btn:active { transform: scale(0.94); }
    .footnote {
      margin-top: 12px;
      font-size: 11px;
      color: #50676f;
      text-align: center;
      letter-spacing: 0.2px;
    }
    .level-up {
      background: #263f3c;
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 12px;
      color: #c0f0e0;
      border: 1px solid #4d8a7a;
      display: inline-block;
      white-space: nowrap;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2f33;
      color: #d0edf0;
      padding: 10px 20px;
      border-radius: 60px;
      border: 1px solid #4a7a7a;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      backdrop-filter: blur(6px);
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .empty-quests {
      padding: 20px 12px;
      text-align: center;
      color: #7e959f;
      font-size: 14px;
    }
    .empty-quests .emoji { font-size: 36px; display: block; margin-bottom: 8px; }
    .all-completed-notice {
      margin-top: 12px;
      padding: 8px 12px;
      background: #1a2f2a;
      border-radius: 16px;
      border: 1px solid #3a6a5a;
      text-align: center;
      font-size: 13px;
      color: #8ac0a0;
    }
    .mode-locked-notice {
      margin-top: 8px;
      padding: 10px 14px;
      background: #2a1f1a;
      border-radius: 16px;
      border: 1px solid #7a4a2a;
      text-align: center;
      font-size: 12px;
      color: #e0a080;
      line-height: 1.4;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 12px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #14181a;
      border-radius: 32px;
      padding: 24px 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #2a3135;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      scrollbar-width: thin;
      scrollbar-color: #3a4f58 #14181a;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal::-webkit-scrollbar { width: 6px; }
    .modal::-webkit-scrollbar-track { background: #14181a; }
    .modal::-webkit-scrollbar-thumb { background: #3a4f58; border-radius: 3px; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }
    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #e0f0fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      background: #1e2a30;
      border: 1px solid #3a4f58;
      color: #b8d4e0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      line-height: 1;
    }
    .modal-close:active { transform: scale(0.9); }
    .modal-close:hover {
      background: #3a2a2a;
      border-color: #7a4a4a;
      color: #ffb0b0;
    }
    .stat-block {
      background: #101618;
      border-radius: 24px;
      padding: 16px 16px;
      margin-bottom: 14px;
      border: 1px solid #263034;
    }
    .stat-block h3 {
      font-size: 13px;
      font-weight: 500;
      color: #8a9ba5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .big-numbers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .big-number {
      background: #1b2429;
      border-radius: 18px;
      padding: 12px 14px;
      border: 1px solid #2a3b44;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .big-number .num {
      font-size: 24px;
      font-weight: 700;
      color: #e0f0fa;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .big-number .num.mind-color { color: #8ab8e8; }
    .big-number .num.body-color { color: #e8b888; }
    .big-number .num.xp-color { color: #b8e0a0; }
    .big-number .num.soap-color { color: #a0d8ff; }
    .big-number .num.streak-color { color: #ffd780; }
    .big-number .lbl {
      font-size: 11px;
      color: #8a9ba5;
      letter-spacing: 0.2px;
    }
    .progress-line {
      margin-top: 10px;
      background: #1b2429;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid #2a3b44;
    }
    .progress-line .pl-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #a6bbc8;
      margin-bottom: 8px;
    }
    .progress-line .pl-top .pl-label { font-weight: 500; }
    .progress-line .pl-top .pl-value { color: #e0f0fa; font-weight: 600; }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #0b0d0e;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a7a8c, #6a9aac);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .quest-type-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .type-stat {
      background: #1b2429;
      border-radius: 18px;
      padding: 14px 14px;
      border: 1px solid #2a3b44;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .type-stat .ts-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a6bbc8;
      font-weight: 500;
    }
    .type-stat .ts-count {
      font-size: 22px;
      font-weight: 700;
      color: #e0f0fa;
      line-height: 1;
    }
    .type-stat .ts-bar {
      width: 100%;
      height: 5px;
      background: #0b0d0e;
      border-radius: 10px;
      overflow: hidden;
    }
    .type-stat .ts-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .ts-bar-fill.mind-fill { background: #5a8ac0; }
    .ts-bar-fill.body-fill { background: #c08a5a; }
    .type-stat .ts-pct { font-size: 11px; color: #7a8b96; }
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .activity-day {
      aspect-ratio: 1;
      background: #1b2429;
      border-radius: 6px;
      border: 1px solid #2a3b44;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;

    const HARD_QUEST_POOL = [
      { type: 'body', title: 'Интенсивная тренировка', desc: 'Отжимания 5×20, приседания 5×30, планка 3×60с', xp: 80 },

    const STORAGE_KEY = 'hero_forge_data';

    const MODES = {
      mind: { label: '🧠 Ум', hint: '🧠 Режим ума: только когнитивные квесты', questTypes: ['mind'] },
      body: { label: '💪 Тело', hint: '💪 Режим тела: только физические квесты', questTypes: ['body'] },
      balance: { label: '⚖️ Баланс', hint: '⚖️ Баланс: тело и ум вместе', questTypes: ['mind', 'body'] },
    };

    let state = {
      level: 1,
      xp: 0,
      dayCounter: 0,
      lastDate: null,
      completedToday: [],
      currentQuests: [],
      hardQuestUsed: false,
      hardQuestCompleted: false,
      hardQuestIndex: -1,
      refreshCount: 2,
      hardRefreshCount: 1,
      mode: 'balance',
      soap: 0,
      ownedRelics: [],
      activeRelic: null,
      streakShield: 0,
      modeLocked: false,
      stats: {
        totalCompleted: 0, mindCompleted: 0, bodyCompleted: 0,
        hardCompleted: 0, totalXpEarned: 0, streak: 0, bestStreak: 0,
        activeDays: [], totalSoapEarned: 0, totalSoapSpent: 0,
        totalXpExchanged: 0,
      },
    };

    const levelDisplay = document.getElementById('levelDisplay');
    const xpDisplay = document.getElementById('xpDisplay');
    const dayCounter = document.getElementById('dayCounter');
    const soapDisplay = document.getElementById('soapDisplay');
    const todayDate = document.getElementById('todayDate');
    const questContainer = document.getElementById('questContainer');
    const levelUpBadge = document.getElementById('levelUpBadge');
    const refreshBtn = document.getElementById('refreshQuestsBtn');
    const refreshBadge = document.getElementById('refreshBadge');
    const hardQuestBtn = document.getElementById('hardQuestBtn');
    const hardQuestBadge = document.getElementById('hardQuestBadge');
    const resetBtn = document.getElementById('resetProgressBtn');
    const toastEl = document.getElementById('toast');
    const difficultyLevel = document.getElementById('difficultyLevel');
    const modeHint = document.getElementById('modeHint');
    const modeSwitcher = document.getElementById('modeSwitcher');
    const statsBtn = document.getElementById('statsBtn');
    const statsModal = document.getElementById('statsModal');
    const statsContent = document.getElementById('statsContent');
    const statsCloseBtn = document.getElementById('statsCloseBtn');
    const shopBtn = document.getElementById('shopBtn');
    const shopModal = document.getElementById('shopModal');
    const shopContent = document.getElementById('shopContent');
    const shopCloseBtn = document.getElementById('shopCloseBtn');
    const activeRelicBanner = document.getElementById('activeRelicBanner');
    const activeRelicIcon = document.getElementById('activeRelicIcon');
    const activeRelicName = document.getElementById('activeRelicName');
    const activeRelicDesc = document.getElementById('activeRelicDesc');

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function formatDate(iso) {
      if (!iso) return '';
      const parts = iso.split('-');
      return `${parts[2]}.${parts[1]}`;
    }

    let toastTimeout = null;
    function showToast(message, duration = 2200) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    function getActiveRelic() {
      if (!state.activeRelic) return null;
      return SHOP_ITEMS.relics.find(r => r.id === state.activeRelic) || null;
    }

    function getBoostForQuest(quest) {
      const relic = getActiveRelic();
      if (!relic) return 0;
      if (relic.type === 'mind' && quest.type !== 'mind') return 0;
      if (relic.type === 'body' && quest.type !== 'body') return 0;
      return relic.boost;
    }

    function getQuestXpWithBoost(quest) {
      const boost = getBoostForQuest(quest);
      return Math.round(quest.xp * (1 + boost));
    }

    function getQuestSoapReward(quest) {
      return quest.isHard ? HARD_QUEST_SOAP : NORMAL_QUEST_SOAP;
    }

    function isModeLocked() {
      return state.modeLocked;
    }

    function updateStreakOnNewDay(oldDate, newDate) {
      if (!oldDate) { state.stats.streak = 0; return; }
      const oldD = new Date(oldDate + 'T00:00:00');
      const newD = new Date(newDate + 'T00:00:00');
      const diffDays = Math.round((newD - oldD) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) {
        state.stats.streak = (state.stats.streak || 0) + 1;
      } else if (diffDays > 1) {
        if (state.streakShield > 0 && diffDays === 2) {
          state.streakShield -= 1;
          state.stats.streak = (state.stats.streak || 0) + 1;
          showToast('🛡️ Щит серии использован!', 2500);
        } else {
          state.stats.streak = 1;
        }
      }
      if (state.stats.streak > (state.stats.bestStreak || 0)) {
        state.stats.bestStreak = state.stats.streak;
      }
    }

    function addActiveDay(dateStr) {
      if (!state.stats.activeDays) state.stats.activeDays = [];
      if (!state.stats.activeDays.includes(dateStr)) {
        state.stats.activeDays.push(dateStr);
        if (state.stats.activeDays.length > 60) {
          state.stats.activeDays = state.stats.activeDays.slice(-60);
        }
      }
    }

    function generateDailyQuests(level, mode) {
      const modeConfig = MODES[mode] || MODES.balance;
      const allowedTypes = modeConfig.questTypes;
      const filtered = QUEST_TEMPLATES.filter(t => allowedTypes.includes(t.type));
      const shuffled = [...filtered].sort(() => Math.random() - 0.5);
      const count = Math.random() < 0.5 ? 4 : 5;
      const selected = shuffled.slice(0, Math.min(count, shuffled.length));
      return selected.map(template => {
        const xpMultiplier = 1 + (level - 1) * 0.15;
        const baseXp = template.baseXp || 20;
        const scaledXp = Math.round(baseXp * xpMultiplier);
        return {
          type: template.type,
          title: template.baseTitle,
          desc: template.baseDesc(level),
          xp: scaledXp,
        };
      });
    }

    function generateHardQuest(level, mode) {
      const modeConfig = MODES[mode] || MODES.balance;
      const allowedTypes = modeConfig.questTypes;
      const filtered = HARD_QUEST_POOL.filter(q => allowedTypes.includes(q.type));
      if (filtered.length === 0) return null;
      const shuffled = [...filtered].sort(() => Math.random() - 0.5);
      const baseQuest = shuffled[0];
      const xpMultiplier = 1 + (level - 1) * 0.1;
      const scaledXp = Math.round(baseQuest.xp * xpMultiplier);
      return { ...baseQuest, xp: scaledXp };
    }

    function recalcLevel() {
      const newLevel = Math.floor(state.xp / 100) + 1;
      if (newLevel > state.level) {
        state.level = newLevel;
        levelUpBadge.style.display = 'inline-block';
        showToast(`⬆ Уровень ${state.level}!`, 2500);
        setTimeout(() => { levelUpBadge.style.display = 'none'; }, 2800);
      } else {
        state.level = Math.max(1, newLevel);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        state.level = data.level ?? 1;
        state.xp = data.xp ?? 0;
        state.dayCounter = data.dayCounter ?? 0;
        state.lastDate = data.lastDate ?? null;
        state.completedToday = data.completedToday ?? [];
        state.currentQuests = data.currentQuests ?? [];
        state.hardQuestUsed = data.hardQuestUsed ?? false;
        state.hardQuestCompleted = data.hardQuestCompleted ?? false;
        state.hardQuestIndex = data.hardQuestIndex ?? -1;
        state.refreshCount = data.refreshCount ?? 2;
        state.hardRefreshCount = data.hardRefreshCount ?? 1;
        state.mode = data.mode ?? 'balance';
        state.soap = data.soap ?? 0;
        state.ownedRelics = data.ownedRelics ?? [];
        state.activeRelic = data.activeRelic ?? null;
        state.streakShield = data.streakShield ?? 0;
        state.modeLocked = data.modeLocked ?? false;
        if (data.stats) {
          state.stats = {
            totalCompleted: data.stats.totalCompleted ?? 0,
            mindCompleted: data.stats.mindCompleted ?? 0,
            bodyCompleted: data.stats.bodyCompleted ?? 0,
            hardCompleted: data.stats.hardCompleted ?? 0,
            totalXpEarned: data.stats.totalXpEarned ?? 0,
            streak: data.stats.streak ?? 0,
            bestStreak: data.stats.bestStreak ?? 0,
            activeDays: data.stats.activeDays ?? [],
            totalSoapEarned: data.stats.totalSoapEarned ?? 0,
            totalSoapSpent: data.stats.totalSoapSpent ?? 0,
            totalXpExchanged: data.stats.totalXpExchanged ?? 0,
          };
        }
        return true;
      } catch (e) { return false; }
    }

    function initDay() {
      const today = getTodayStr();
      todayDate.textContent = formatDate(today);
      if (state.lastDate !== today || state.currentQuests.length === 0) {
        if (state.lastDate !== null && state.lastDate !== today) {
          updateStreakOnNewDay(state.lastDate, today);
          state.dayCounter += 1;
        }
        if (state.lastDate === null) {
          state.dayCounter = 0;
          state.stats.streak = 1;
          state.stats.bestStreak = 1;
        }
        state.currentQuests = generateDailyQuests(state.level, state.mode);
        state.completedToday = [];
        state.hardQuestUsed = false;
        state.hardQuestCompleted = false;
        state.hardQuestIndex = -1;
        state.refreshCount = 2;
        state.hardRefreshCount = 1;
        state.modeLocked = false;
        state.lastDate = today;
        saveState();
      }
      if (state.currentQuests.length === 0) {
        state.currentQuests = generateDailyQuests(state.level, state.mode);
        state.completedToday = [];
        saveState();
      }
    }

    function isAllQuestsCompleted() {
      const totalQuests = state.currentQuests.length;
      if (totalQuests === 0) return false;
      return state.completedToday.length === totalQuests;
    }

    function switchMode(newMode) {
      if (state.mode === newMode) return;

      if (isModeLocked()) {
        showToast('🔒 Режим зафиксирован! Вы уже начали выполнять квесты. Смена режима доступна завтра.', 2800);
        return;
      }

      state.mode = newMode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === newMode);
      });
      modeHint.textContent = MODES[newMode].hint;
      state.currentQuests = generateDailyQuests(state.level, newMode);
      state.completedToday = [];
      state.hardQuestUsed = false;
      state.hardQuestCompleted = false;
      state.hardQuestIndex = -1;
      state.hardRefreshCount = 1;
      saveState();
      render();
      showToast(`${MODES[newMode].label} — квесты обновлены`, 2000);
    }

    function refreshQuests() {
      if (isAllQuestsCompleted()) {
        showToast('✅ Все квесты выполнены! Обновление недоступно до завтра.', 2500);
        return;
      }
      if (state.refreshCount <= 0) {
        showToast('⚠️ Лимит обновлений исчерпан (2/2)', 2000);
        return;
      }
      const today = getTodayStr();
      const newQuests = generateDailyQuests(state.level, state.mode);
      const completedTitles = new Set();
      state.completedToday.forEach(index => {
        const q = state.currentQuests[index];
        if (q && !q.isHard) completedTitles.add(q.title);
      });
      const newCompleted = [];
      newQuests.forEach((q, idx) => {
        if (completedTitles.has(q.title)) newCompleted.push(idx);
      });
      let hasHard = false, hardData = null;
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const hq = state.currentQuests[state.hardQuestIndex];
        if (hq && hq.isHard) {
          if (!state.completedToday.includes(state.hardQuestIndex)) {
            hasHard = true;
            hardData = hq;
          } else {
            state.hardQuestCompleted = true;
            state.hardQuestUsed = true;
          }
        }
      }
      let final = [...newQuests], hIdx = -1;
      if (hasHard && hardData) { final.push(hardData); hIdx = final.length - 1; }
      state.currentQuests = final;
      state.completedToday = newCompleted;
      state.hardQuestIndex = hIdx;
      state.lastDate = today;
      state.refreshCount -= 1;
      if (state.hardQuestCompleted) state.hardQuestUsed = true;
      showToast(`🔄 Обновлено (осталось ${state.refreshCount}/2)`, 1800);
      recalcLevel();
      saveState();
      render();
    }

    function handleHardQuest() {
      if (isAllQuestsCompleted()) {
        showToast('✅ Все квесты выполнены! Обновление недоступно до завтра.', 2500);
        return;
      }
      if (state.hardRefreshCount <= 0) {
        showToast('⚠️ Лимит сложных квестов (1/1)', 2000);
        return;
      }
      if (state.hardQuestUsed && state.hardQuestCompleted) {
        showToast('⚠️ Сложный квест уже выполнен', 2000);
        return;
      }
      if (state.hardQuestIndex >= 0 && state.hardQuestIndex < state.currentQuests.length) {
        const existing = state.currentQuests[state.hardQuestIndex];
        if (existing && existing.isHard) {
          if (state.completedToday.includes(state.hardQuestIndex)) {
            showToast('⚠️ Сложный квест уже выполнен', 2000);
            return;
          }
          state.currentQuests.splice(state.hardQuestIndex, 1);
          state.hardQuestIndex = -1;
        }
      }
      const hardQuest = generateHardQuest(state.level, state.mode);
      if (!hardQuest) { showToast('⚠️ Нет сложных квестов для этого режима', 1800); return; }
      const questWithMarker = { ...hardQuest, isHard: true };
      state.currentQuests.push(questWithMarker);
      state.hardQuestIndex = state.currentQuests.length - 1;
      state.hardQuestUsed = true;
      state.hardQuestCompleted = false;
      state.hardRefreshCount -= 1;
      showToast(`⭐ Сложный квест (осталось ${state.hardRefreshCount}/1)`, 2000);
      recalcLevel();
      saveState();
      render();
    }

    function completeQuest(index) {
      if (state.completedToday.includes(index)) return;
      const quest = state.currentQuests[index];
      if (!quest) return;

      const boostedXp = getQuestXpWithBoost(quest);
      const boost = getBoostForQuest(quest);
      const soapReward = getQuestSoapReward(quest);

      state.xp += boostedXp;
      state.completedToday.push(index);

      if (!state.modeLocked) {
        state.modeLocked = true;
      }

      state.soap += soapReward;
      state.stats.totalSoapEarned += soapReward;

      state.stats.totalCompleted += 1;
      state.stats.totalXpEarned += boostedXp;
      if (quest.isHard) {
        state.stats.hardCompleted += 1;
      } else if (quest.type === 'mind') {
        state.stats.mindCompleted += 1;
      } else if (quest.type === 'body') {
        state.stats.bodyCompleted += 1;
      }
      addActiveDay(getTodayStr());

      const boostText = boost > 0 ? ` (🔥 +${Math.round(boost * 100)}%)` : '';
      const lockText = state.modeLocked ? ' • 🔒 Режим зафиксирован' : '';
      if (quest.isHard) {
        state.hardQuestCompleted = true;
        state.hardQuestUsed = true;
        showToast(`⭐ +${boostedXp} XP${boostText} • +${soapReward} 🧼`, 2200);
      } else {
        showToast(`✅ +${boostedXp} XP${boostText} • +${soapReward} 🧼${lockText}`, 2000);
      }

      recalcLevel();
      saveState();
      render();
    }

    function render() {
      levelDisplay.textContent = state.level;
      xpDisplay.innerHTML = `${state.xp} <small>XP</small>`;
      dayCounter.textContent = state.dayCounter;
      soapDisplay.innerHTML = `${state.soap} <small>🧼</small>`;
      difficultyLevel.textContent = `⚡ Lv.${state.level}`;

      const relic = getActiveRelic();
      if (relic) {
        activeRelicBanner.style.display = 'flex';
        activeRelicIcon.textContent = relic.icon;
        activeRelicName.textContent = relic.name;
        let boostText = `+${Math.round(relic.boost * 100)}% XP`;
        if (relic.type === 'mind') boostText += ' (только ум)';
        else if (relic.type === 'body') boostText += ' (только тело)';
        activeRelicDesc.textContent = boostText;
      } else {
        activeRelicBanner.style.display = 'none';
      }

      const allCompleted = isAllQuestsCompleted();
      const modeLocked = isModeLocked();

      document.querySelectorAll('.mode-btn').forEach(btn => {
        if (btn.dataset.mode === state.mode) {
          btn.disabled = false;
        } else {
          btn.disabled = modeLocked;
        }
      });

      if (modeLocked) {
        modeSwitcher.classList.add('locked');
      } else {
        modeSwitcher.classList.remove('locked');
      }

      if (modeLocked && !allCompleted) {
        modeHint.textContent = '🔒 Режим зафиксирован на сегодня (выполнен квест)';
        modeHint.classList.add('locked-hint');
      } else {
        modeHint.textContent = MODES[state.mode].hint;
        modeHint.classList.remove('locked-hint');
      }

      if (allCompleted) {
        refreshBtn.disabled = true;
        refreshBadge.textContent = '✓';
        refreshBadge.style.background = '#4a7a7a';
        refreshBtn.style.opacity = '0.6';
      } else {
        refreshBtn.disabled = state.refreshCount <= 0;
        refreshBadge.textContent = state.refreshCount;
        refreshBadge.style.background = '#3a4f58';
        refreshBtn.style.opacity = state.refreshCount <= 0 ? '0.4' : '1';
      }

      const isLocked = state.hardQuestCompleted;
      const isExhausted = state.hardRefreshCount <= 0;
      
      if (allCompleted) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '✓';
        hardQuestBadge.style.background = '#4a7a7a';
        hardQuestBtn.style.opacity = '0.6';
      } else if (isLocked) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '✓';
        hardQuestBadge.style.background = '#4a7a7a';
        hardQuestBtn.style.opacity = '0.5';
      } else if (isExhausted && state.hardQuestIndex >= 0) {
        hardQuestBtn.disabled = true;
        hardQuestBadge.textContent = '0';
        hardQuestBadge.style.background = '#4a4a4a';
        hardQuestBtn.style.opacity = '0.5';
      } else if (state.hardQuestIndex >= 0) {
        hardQuestBtn.disabled = false;
        hardQuestBadge.textContent = state.hardRefreshCount;
        hardQuestBadge.style.background = '#ff8a5c';
        hardQuestBtn.style.opacity = '1';
      } else {
        hardQuestBtn.disabled = false;
        hardQuestBadge.textContent = state.hardRefreshCount;
        hardQuestBadge.style.background = '#ff6b35';
        hardQuestBtn.style.opacity = '1';
      }

      if (!state.currentQuests || state.currentQuests.length === 0) {
        questContainer.innerHTML = `<div class="empty-quests"><span class="emoji">📭</span>Нет активных квестов</div>`;
        return;
      }

      let html = '';
      state.currentQuests.forEach((quest, index) => {
        const isDone = state.completedToday.includes(index);
        const doneClass = isDone ? 'completed' : '';
        const icon = quest.type === 'body' ? '💪' : '🧠';
        const hardClass = quest.isHard ? 'hard-quest' : '';
        const hardBadge = quest.isHard ? '<span class="hard-icon">⭐</span>' : '';
        const displayIcon = quest.isHard ? '🔥' : icon;
        const typeClass = !quest.isHard ? (quest.type === 'mind' ? 'mind-quest' : 'body-quest') : '';

        const boost = getBoostForQuest(quest);
        const boostedXp = getQuestXpWithBoost(quest);
        const hasBoost = boost > 0;
        const xpClass = hasBoost ? 'xp-boosted' : 'xp';
        const boostIndicator = hasBoost ? `<span class="boost-indicator">🔥+${Math.round(boost * 100)}%</span>` : '';
        
        const soapReward = getQuestSoapReward(quest);
        const soapClass = quest.isHard ? 'soap-reward-big' : 'soap-reward';

        html += `
          <div class="quest-item ${hardClass} ${typeClass}" data-index="${index}">
            <div class="info">
              <div class="title">${displayIcon} ${quest.title} ${hardBadge}${boostIndicator}</div>
              <div class="desc">${quest.desc}</div>
            </div>
            <div class="badge">
              <span class="${xpClass}">+${boostedXp} XP</span>
              <span class="${soapClass}">+${soapReward} 🧼</span>
              <button class="btn-done ${doneClass}" data-index="${index}" ${isDone ? 'disabled' : ''}>
                ${isDone ? '✓' : '✔'}
              </button>
            </div>
          </div>
        `;
      });
      questContainer.innerHTML = html;

      if (allCompleted) {
        const notice = document.createElement('div');
        notice.className = 'all-completed-notice';
        notice.textContent = '🎉 Все квесты выполнены! Обновление и смена режима недоступны до завтра.';
        const existingNotice = questContainer.querySelector('.all-completed-notice');
        if (!existingNotice) questContainer.appendChild(notice);
      } else if (modeLocked) {
        const notice = document.createElement('div');
        notice.className = 'mode-locked-notice';
        notice.textContent = `🔒 Режим "${MODES[state.mode].label}" зафиксирован на сегодня — выполнено ${state.completedToday.length} квестов.`;
        const existingNotice = questContainer.querySelector('.mode-locked-notice');
        if (!existingNotice) questContainer.appendChild(notice);
      }

      document.querySelectorAll('.btn-done:not(.completed)').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const index = parseInt(this.dataset.index, 10);
          if (isNaN(index)) return;
          completeQuest(index);
        });
      });
      levelUpBadge.style.display = 'none';
    }

    // ============ МАГАЗИН ============
    function renderShop() {
      let html = '';

      html += `
        <div class="shop-balance">
          <div class="shop-balance-left">
            <div class="shop-balance-icon">🧼</div>
            <div>
              <div class="shop-balance-label">Ваш баланс</div>
              <div class="shop-balance-text">${state.soap} 🧼</div>
            </div>
          </div>
          <div class="shop-balance-right">
            <div class="shop-xp-badge">
              <div class="xp-val">${state.xp}</div>
              <div class="xp-lbl">Всего XP</div>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="shop-section-title">🏛️ Реликвии (эффект не складывается)</div>
        <div class="relic-category-note">
          ⚠️ Одновременно активна только <b>одна</b> реликвия. Покупка новой не отменяет старую — 
          вы можете переключаться между купленными реликвиями в любой момент.
        </div>
      `;

      SHOP_ITEMS.relics.forEach(relic => {
        const owned = state.ownedRelics.includes(relic.id);
        const isActive = state.activeRelic === relic.id;
        const canAfford = state.soap >= relic.price;
        
        let btnHtml = '';
        let itemClass = 'shop-item relic-item';
        if (isActive) {
          itemClass += ' active-relic';
          btnHtml = `<button class="shop-buy-btn active-btn" disabled>✓ Активна</button>`;
        } else if (owned) {
          itemClass += ' owned';
          btnHtml = `<button class="shop-buy-btn activate-btn" data-action="activate-relic" data-id="${relic.id}">⚡ Активировать</button>`;
        } else {
          btnHtml = `<button class="shop-buy-btn" data-action="buy-relic" data-id="${relic.id}" ${!canAfford ? 'disabled' : ''}>Купить • ${relic.price} 🧼</button>`;
        }

        let effectClass = 'shop-item-effect';
        let effectText = `+${Math.round(relic.boost * 100)}% XP ко всем квестам`;
        if (relic.type === 'mind') {
          effectClass += ' mind-effect';
          effectText = `+${Math.round(relic.boost * 100)}% XP только к 🧠 умственным квестам`;
        } else if (relic.type === 'body') {
          effectClass += ' body-effect';
          effectText = `+${Math.round(relic.boost * 100)}% XP только к 💪 физическим квестам`;
        }

        html += `
          <div class="${itemClass}">
            <div class="shop-item-icon">${relic.icon}</div>
            <div class="shop-item-info">
              <div class="shop-item-name">
                ${relic.name}
                <span class="relic-badge">РЕЛИКВИЯ</span>
              </div>
              <div class="shop-item-desc">${relic.desc}</div>
              <div class="${effectClass}">${effectText}</div>
            </div>
            ${btnHtml}
          </div>
        `;
      });

      const canExchange = state.xp >= XP_TO_SOAP_RATE;
      html += `
        <div class="shop-section-title">💱 Обмен опыта на мыло</div>
        <div class="exchange-category-note">
          ⚠️ Обмен опыта <b>снижает ваш уровень</b>! Потратьте XP с умом — уровень упадёт, если станет меньше порога.
        </div>
        <div class="shop-item exchange-item">
          <div class="shop-item-icon">💱</div>
          <div class="shop-item-info">
            <div class="shop-item-name">
              Обмен опыта на мыло
              <span class="exchange-badge">ОБМЕН</span>
            </div>
            <div class="shop-item-desc">Обменять ${XP_TO_SOAP_RATE} XP на ${SOAP_REWARD} 🧼. Уровень пересчитается автоматически.</div>
            <div class="shop-item-effect exchange-effect">
              ${state.xp} XP → ${Math.floor(state.xp / XP_TO_SOAP_RATE) * SOAP_REWARD} 🧼 доступно
              (${Math.floor(state.xp / XP_TO_SOAP_RATE)} обменов)
            </div>
          </div>
          <button class="shop-buy-btn exchange-btn" data-action="exchange-xp" ${!canExchange ? 'disabled' : ''}>
            Обменять • ${XP_TO_SOAP_RATE} XP → ${SOAP_REWARD} 🧼
          </button>
        </div>
      `;

      html += `<div class="shop-section-title">🧪 Расходники</div>`;

      SHOP_ITEMS.consumables.forEach(item => {
        const canAfford = state.soap >= item.price;
        let btnHtml = `<button class="shop-buy-btn" data-action="buy-consumable" data-id="${item.id}" ${!canAfford ? 'disabled' : ''}>Купить • ${item.price} 🧼</button>`;
        let itemClass = 'shop-item consumable-item';
        let valueBadge = '';
        
        // Особый стиль для эликсира (лучшая цена)
        if (item.bestValue) {
          itemClass += ' best-value';
          valueBadge = `<span class="value-badge">ЛУЧШАЯ ЦЕНА</span>`;
        }

        html += `
          <div class="${itemClass}">
            <div class="shop-item-icon">${item.icon}</div>
            <div class="shop-item-info">
              <div class="shop-item-name">
                ${item.name}
                ${valueBadge}
              </div>
              <div class="shop-item-desc">${item.desc}</div>
            </div>
            ${btnHtml}
          </div>
        `;
      });

      shopContent.innerHTML = html;

      shopContent.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          const id = this.dataset.id;
          if (action === 'buy-relic') buyRelic(id);
          else if (action === 'activate-relic') activateRelic(id);
          else if (action === 'buy-consumable') buyConsumable(id);
          else if (action === 'exchange-xp') exchangeXpForSoap();
        });
      });
    }

    function buyRelic(relicId) {
      const relic = SHOP_ITEMS.relics.find(r => r.id === relicId);
      if (!relic) return;
      if (state.ownedRelics.includes(relicId)) {
        showToast('⚠️ Реликвия уже куплена', 1800);
        return;
      }
      if (state.soap < relic.price) {
        showToast('⚠️ Недостаточно мыла', 1800);
        return;
      }
      if (!confirm(`Купить "${relic.name}" за ${relic.price} 🧼?`)) return;

      state.soap -= relic.price;
      state.stats.totalSoapSpent += relic.price;
      state.ownedRelics.push(relicId);
      
      if (!state.activeRelic) {
        state.activeRelic = relicId;
        showToast(`${relic.icon} ${relic.name} куплена и активирована!`, 2500);
      } else {
        showToast(`${relic.icon} ${relic.name} куплена!`, 2200);
      }
      
      saveState();
      render();
      renderShop();
    }

    function activateRelic(relicId) {
      if (!state.ownedRelics.includes(relicId)) return;
      const relic = SHOP_ITEMS.relics.find(r => r.id === relicId);
      if (!relic) return;
      
      state.activeRelic = relicId;
      saveState();
      render();
      renderShop();
      showToast(`${relic.icon} ${relic.name} активирована!`, 2000);
    }

    function exchangeXpForSoap() {
      if (state.xp < XP_TO_SOAP_RATE) {
        showToast(`⚠️ Нужно минимум ${XP_TO_SOAP_RATE} XP`, 2000);
        return;
      }

      const exchangesPossible = Math.floor(state.xp / XP_TO_SOAP_RATE);
      const totalXpToSpend = exchangesPossible * XP_TO_SOAP_RATE;
      const totalSoapToGet = exchangesPossible * SOAP_REWARD;

      if (!confirm(`Обменять ${totalXpToSpend} XP на ${totalSoapToGet} 🧼?\n\nВнимание: ваш уровень может понизиться!`)) return;

      state.xp -= totalXpToSpend;
      state.soap += totalSoapToGet;
      
      state.stats.totalXpExchanged += totalXpToSpend;
      state.stats.totalSoapEarned += totalSoapToGet;
      
      recalcLevelAfterExchange();

      saveState();
      render();
      renderShop();
      showToast(`💱 Обменяно ${totalXpToSpend} XP → ${totalSoapToGet} 🧼`, 2500);
    }

    function recalcLevelAfterExchange() {
      const newLevel = Math.floor(state.xp / 100) + 1;
      if (newLevel !== state.level) {
        const oldLevel = state.level;
        state.level = Math.max(1, newLevel);
        if (state.level < oldLevel) {
          showToast(`📉 Уровень понижен: ${oldLevel} → ${state.level}`, 2500);
        } else if (state.level > oldLevel) {
          levelUpBadge.style.display = 'inline-block';
          showToast(`⬆ Уровень ${state.level}!`, 2500);
          setTimeout(() => { levelUpBadge.style.display = 'none'; }, 2800);
        }
      }
    }

    function buyConsumable(itemId) {
      const item = SHOP_ITEMS.consumables.find(c => c.id === itemId);
      if (!item) return;
      if (state.soap < item.price) {
        showToast('⚠️ Недостаточно мыла', 1800);
        return;
      }
      if (!confirm(`Купить "${item.name}" за ${item.price} 🧼?`)) return;

      state.soap -= item.price;
      state.stats.totalSoapSpent += item.price;

      let effectMessage = '';
      switch(itemId) {
        case 'extra_refresh':
          state.refreshCount += 1;
          effectMessage = `+1 обновление (теперь ${state.refreshCount})`;
          break;
        case 'extra_hard':
          state.hardRefreshCount += 1;
          effectMessage = `+1 сложный квест (теперь ${state.hardRefreshCount})`;
          break;
        case 'instant_xp':
          // НОВОЕ: теперь даёт 100 XP за 5 мыла
          const xpGain = item.xpReward || 100;
          state.xp += xpGain;
          state.stats.totalXpEarned += xpGain;
          recalcLevel();
          effectMessage = `+${xpGain} XP за ${item.price} 🧼`;
          break;
        case 'full_reset_daily':
          state.refreshCount = 2;
          state.hardRefreshCount = 1;
          state.hardQuestUsed = false;
          state.hardQuestCompleted = false;
          effectMessage = `Сброшены дневные лимиты`;
          break;
        case 'streak_shield':
          state.streakShield += 1;
          effectMessage = `Щит серии: ${state.streakShield}`;
          break;
      }

      saveState();
      render();
      renderShop();
      showToast(`${item.icon} ${effectMessage}`, 2400);
    }

    function openShop() {
      renderShop();
      shopModal.classList.add('open');
    }

    function closeShop() {
      shopModal.classList.remove('open');
    }

    // ============ СТАТИСТИКА ============
    function renderStats() {
      const s = state.stats;
      const total = s.totalCompleted || 0;
      const mindPct = total > 0 ? Math.round((s.mindCompleted / total) * 100) : 0;
      const bodyPct = total > 0 ? Math.round((s.bodyCompleted / total) * 100) : 0;
      const maxTypeCount = Math.max(s.mindCompleted, s.bodyCompleted, 1);

      const xpInLevel = state.xp % 100;
      const levelProgress = Math.min(100, Math.round((xpInLevel / 100) * 100));

      const today = new Date();
      const days = [];
      for (let i = 27; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        days.push({
          date: dateStr,
          day: d.getDate(),
          isActive: s.activeDays.includes(dateStr),
          isToday: i === 0,
        });
      }

      let html = '';

      html += `
        <div class="stat-block">
          <h3>🧼 Мыло</h3>
          <div class="big-numbers">
            <div class="big-number">
              <div class="num soap-color">${state.soap}</div>
              <div class="lbl">Текущий баланс</div>
            </div>
            <div class="big-number">
              <div class="num soap-color">${s.totalSoapEarned}</div>
              <div class="lbl">Всего заработано</div>
            </div>
            <div class="big-number">
              <div class="num" style="color:#e0a080;">${s.totalSoapSpent}</div>
              <div class="lbl">Потрачено в магазине</div>
            </div>
            <div class="big-number">
              <div class="num" style="color:#d8a0e8;">${s.totalXpExchanged || 0}</div>
              <div class="lbl">Обменяно XP</div>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="stat-block">
          <h3>📈 Общий прогресс</h3>
          <div class="big-numbers">
            <div class="big-number">
              <div class="num xp-color">${s.totalXpEarned}</div>
              <div class="lbl">Всего заработано XP</div>
            </div>
            <div class="big-number">
              <div class="num">${s.totalCompleted}</div>
              <div class="lbl">Выполнено квестов</div>
            </div>
            <div class="big-number">
              <div class="num streak-color">${s.streak}</div>
              <div class="lbl">Текущая серия (дней)</div>
            </div>
            <div class="big-number">
              <div class="num" style="color: #ffb088;">${s.bestStreak}</div>
              <div class="lbl">Лучшая серия</div>
            </div>
          </div>
          <div class="progress-line" style="margin-top: 12px;">
            <div class="pl-top">
              <span class="pl-label">До уровня ${state.level + 1}</span>
              <span class="pl-value">${xpInLevel} / 100 XP</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${levelProgress}%;"></div>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="stat-block">
          <h3>🎯 По типам квестов</h3>
          <div class="quest-type-stats">
            <div class="type-stat">
              <div class="ts-header">🧠 Ум</div>
              <div class="ts-count mind-color">${s.mindCompleted}</div>
              <div class="ts-bar">
                <div class="ts-bar-fill mind-fill" style="width: ${(s.mindCompleted / maxTypeCount) * 100}%;"></div>
              </div>
              <div class="ts-pct">${mindPct}% от всех</div>
            </div>
            <div class="type-stat">
              <div class="ts-header">💪 Тело</div>
              <div class="ts-count body-color">${s.bodyCompleted}</div>
              <div class="ts-bar">
                <div class="ts-bar-fill body-fill" style="width: ${(s.bodyCompleted / maxTypeCount) * 100}%;"></div>
              </div>
              <div class="ts-pct">${bodyPct}% от всех</div>
            </div>
          </div>
          <div class="progress-line" style="margin-top: 10px;">
            <div class="pl-top">
              <span class="pl-label">🔥 Сложных выполнено</span>
              <span class="pl-value" style="color: #ffb088;">${s.hardCompleted}</span>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="stat-block">
          <h3>📅 Активность (28 дней)</h3>
          <div class="activity-grid">
      `;
      days.forEach(d => {
        const classes = ['activity-day'];
        if (d.isActive) classes.push('active');
        if (d.isToday) classes.push('today');
        html += `<div class="${classes.join(' ')}" title="${d.date}">${d.day}</div>`;
      });
      html += `
          </div>
          <div class="activity-legend">
            <span>← 4 недели назад</span>
            <span>Сегодня →</span>
          </div>
        </div>
      `;

      if (total === 0) {
        html += `
          <div class="empty-stats">
            <span class="emoji">🌱</span>
            Начните выполнять квесты, чтобы увидеть статистику!
          </div>
        `;
      } else {
        html += `
          <div class="stat-block" style="margin-bottom: 0;">
            <h3>💡 Итог</h3>
            <div style="font-size: 13px; color: #a6bbc8; line-height: 1.6;">
              Вы выполнили <b style="color:#e0f0fa;">${total}</b> квестов, заработали 
              <b style="color:#b8e0a0;">${s.totalXpEarned} XP</b> и 
              <b style="color:#a0d8ff;">${s.totalSoapEarned} 🧼</b>. 
              ${s.streak > 1 ? `Держите серию — <b style="color:#ffd780;">${s.streak} дней подряд!</b>` : 'Продолжайте в том же духе!'}
            </div>
          </div>
        `;
      }

      statsContent.innerHTML = html;
    }

    function openStats() {
      renderStats();
      statsModal.classList.add('open');
    }

    function closeStats() {
      statsModal.classList.remove('open');
    }

    function resetProgress() {
      if (confirm('Сбросить весь прогресс? (уровень, очки, квесты, мыло, реликвии и статистика)')) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          level: 1, xp: 0, dayCounter: 0, lastDate: null,
          completedToday: [], currentQuests: [],
          hardQuestUsed: false, hardQuestCompleted: false, hardQuestIndex: -1,
          refreshCount: 2, hardRefreshCount: 1, mode: 'balance',
          soap: 0, ownedRelics: [], activeRelic: null, streakShield: 0,
          modeLocked: false,
          stats: {
            totalCompleted: 0, mindCompleted: 0, bodyCompleted: 0,
            hardCompleted: 0, totalXpEarned: 0, streak: 0, bestStreak: 0,
            activeDays: [], totalSoapEarned: 0, totalSoapSpent: 0,
            totalXpExchanged: 0,
          },
        };
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === 'balance');
        });
        modeHint.textContent = MODES.balance.hint;
        modeHint.classList.remove('locked-hint');
        modeSwitcher.classList.remove('locked');
        initDay(); render();
        closeStats();
        closeShop();
        showToast('🔄 Прогресс сброшен', 1800);
      }
    }

    function init() {
      loadState();
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.mode);
      });
      modeHint.textContent = MODES[state.mode].hint;
      initDay();
      recalcLevel();
      render();
      
      modeSwitcher.addEventListener('click', function(e) {
        const btn = e.target.closest('.mode-btn');
        if (!btn) return;
        if (btn.disabled) return;
        switchMode(btn.dataset.mode);
      });
      
      refreshBtn.addEventListener('click', refreshQuests);
      hardQuestBtn.addEventListener('click', handleHardQuest);
      resetBtn.addEventListener('click', resetProgress);
      statsBtn.addEventListener('click', openStats);
      statsCloseBtn.addEventListener('click', closeStats);
      shopBtn.addEventListener('click', openShop);
      shopCloseBtn.addEventListener('click', closeShop);
      
      statsModal.addEventListener('click', function(e) {
        if (e.target === statsModal) closeStats();
      });
      shopModal.addEventListener('click', function(e) {
        if (e.target === shopModal) closeShop();
      });
      
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeStats();
          closeShop();
        }
      });
      
      setInterval(() => {
        const today = getTodayStr();
        if (state.lastDate !== today) {
          initDay();
          recalcLevel();
          render();
          showToast('🌅 Новый день! Режим разблокирован.', 2400);
        }
      }, 3600000);
    }
    init();
  })();
</script>
</body>
</html>
